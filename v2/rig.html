<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proef: aanpak A (getekend + skelet) en B (pixel art)</title>
<style>body{margin:0;background:#1d2b2c;color:#f2e6c8;font-family:system-ui,sans-serif}h1{font-size:18px;margin:12px 16px 4px}p{margin:0 16px 8px;font-size:13px;color:#c8d4c8}canvas{display:block;width:100%}</style>
</head><body>
<h1>Proef: dezelfde habilis in twee technieken</h1>
<p>Boven: A, getekende vormen met skelet. Midden: B, pixel art. Telkens groot en op spelgrootte. Onder: de huidige versie ter vergelijking.</p>
<canvas id="c"></canvas>
<script type="module">
import { drawRig, pose } from './src/rig.js';
import { drawPixel } from './src/pixel.js';
import { Player } from './src/player.js';
const cv = document.getElementById('c'), c = cv.getContext('2d');
let W, H;
function size() { W = Math.min(innerWidth, 1100); H = Math.round(W * 1.05); cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; cv.style.height = H + 'px'; }
size(); addEventListener('resize', size);
const old = new Player(0, 0);
const names = ['walk', 'run', 'jump', 'fall', 'throw', 'cheer'];
function band(y0, h, label) {
  const g = c.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, '#a8d4d8'); g.addColorStop(1, '#e8dcae'); c.fillStyle = g; c.fillRect(0, y0, W, h);
  c.fillStyle = '#1d2b2c'; c.font = '700 15px system-ui'; c.fillText(label, 12, y0 + 22);
}
function frame(now) {
  const t = now / 1000;
  c.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  c.imageSmoothingEnabled = false;
  const bh = H * 0.45;
  // --- A ---
  band(0, bh, 'A · getekende vormen + skelet');
  let gy = bh * 0.62, S = gy / 150;
  c.fillStyle = '#8cbc45'; c.fillRect(0, gy, W, 3); c.fillRect(0, bh - 22, W, 3);
  c.save(); c.translate(W * 0.15, gy); c.scale(S, S); drawRig(c, 'habilis', pose('idle', t * 2), { blink: (t % 4) < 0.12 }); c.restore();
  c.save(); c.translate(W * 0.4, gy); c.scale(S, S); drawRig(c, 'habilis', pose('walk', t * 7)); c.restore();
  names.forEach((n, i) => { c.save(); c.translate(W * (0.58 + i * 0.07), bh - 22); c.scale(0.45, 0.45); drawRig(c, 'habilis', pose(n, t * (n === 'run' ? 11 : n === 'throw' ? 3 : 7)), { tool: n === 'throw' ? 'stone' : null }); c.restore(); });
  c.fillStyle = '#1d2b2c'; c.font = '12px system-ui'; c.fillText('spelgrootte →', W * 0.52, bh - 30);
  // --- B ---
  band(bh, bh, 'B · pixel art');
  gy = bh + bh * 0.62; const P = Math.floor(gy / 1 - bh) / 34 | 0 || 6;
  c.fillStyle = '#8cbc45'; c.fillRect(0, gy, W, 3); c.fillRect(0, 2 * bh - 22, W, 3);
  const big = Math.max(4, Math.floor((bh * 0.5) / 28));
  c.save(); c.translate(Math.round(W * 0.15), gy); c.scale(big, big); drawPixel(c, 'idle', t * 1.6, { blink: (t % 4) < 0.12 }); c.restore();
  c.save(); c.translate(Math.round(W * 0.4), gy); c.scale(big, big); drawPixel(c, 'walk', t * 8); c.restore();
  names.forEach((n, i) => { c.save(); c.translate(Math.round(W * (0.58 + i * 0.07)), 2 * bh - 22); c.scale(2, 2); drawPixel(c, n === 'run' ? 'walk' : n, t * (n === 'run' ? 12 : n === 'throw' ? 2 : 6), { stone: true }); c.restore(); });
  c.fillStyle = '#1d2b2c'; c.font = '12px system-ui'; c.fillText('spelgrootte →', W * 0.52, 2 * bh - 30);
  // --- Huidig ---
  band(2 * bh, H - 2 * bh, 'Huidige versie');
  const gy3 = H - 12; c.fillStyle = '#8cbc45'; c.fillRect(0, gy3, W, 3);
  c.save(); c.translate(W * 0.15, gy3); const s3 = (H - 2 * bh - 30) / 56; c.scale(s3, s3); old.x = -old.w / 2; old.y = -old.h; old.onGround = true; old.draw(c, t); c.restore();
  c.save(); c.translate(W * 0.6, gy3); old.draw(c, t); c.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
