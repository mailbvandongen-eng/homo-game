<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18272c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homo Game">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>HOMO — de lange reis</title>
<style>
:root{color-scheme:dark;--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#15252a;touch-action:none;-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#title{position:fixed;inset:0;display:grid;place-items:center;z-index:3;background:linear-gradient(90deg,#10232955,#10232912 60%,#10232940);transition:opacity .55s ease}
#title.off{opacity:0;pointer-events:none}
.titleCard{width:min(440px,86vw);padding:20px 26px;text-align:center;background:linear-gradient(145deg,#10272bc9,#19322ca8);border:1px solid #f5dc9a99;border-radius:22px;box-shadow:0 18px 65px #10232955;backdrop-filter:blur(7px)}
.eyebrow{font-size:clamp(10px,1.8vh,13px);font-weight:850;letter-spacing:.22em;color:#f6cf75;text-transform:uppercase}
h1{margin:7px 0 3px;font-size:clamp(44px,11vh,78px);line-height:.92;letter-spacing:.04em;color:#fff0bb;text-shadow:0 4px #a45038,0 8px #352328}
.sub{margin:8px 0 14px;color:#e6e1c9;font-size:clamp(12px,2.1vh,15px)}
#startButton{width:54px;height:54px;border-radius:50%;border:1px solid #fff3c2;background:#f8c64cdd;color:#26302c;display:grid;place-items:center;margin:auto;box-shadow:0 6px 18px #0c171955;touch-action:none}
#startButton svg{width:22px;height:22px;margin-left:3px}
#skip{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:none;width:38px;height:38px;border-radius:50%;border:1px solid #fff8;background:#15272555;color:#fff0c8;font-size:23px;line-height:1;touch-action:none;backdrop-filter:blur(5px)}
#hint{position:fixed;z-index:2;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#17282455;color:#fff2d3;text-shadow:0 1px 5px #243024;font-weight:750;font-size:clamp(11px,1.8vh,14px);letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}
#throw{position:fixed;z-index:2;right:max(20px,var(--safeR));bottom:max(18px,var(--safeB));width:48px;height:48px;border-radius:50%;border:1.5px solid #fff9;background:#273b3590;color:#fff0c8;display:none;place-items:center;padding:0;backdrop-filter:blur(4px);touch-action:none;box-shadow:0 4px 12px #1115}
#throw:active{transform:scale(.92);background:#f0bb5dbb}
#throw svg{width:24px;height:24px;filter:drop-shadow(0 1px 2px #14211c)}
@media(max-height:440px) and (orientation:landscape){.titleCard{padding:13px 22px;width:min(380px,74vw)}h1{font-size:clamp(40px,12vh,58px)}.sub{margin:6px 0 10px}#startButton{width:46px;height:46px}#throw{width:43px;height:43px}}
@media(orientation:portrait){#title:after{content:"Draai je telefoon liggend";position:fixed;inset:auto 15px 15px;text-align:center;color:#fff0c8;font-size:12px;opacity:.75}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title"><div class="titleCard"><div class="eyebrow">Een bewegingsoefening in de Riftvallei</div><h1>HOMO</h1><div class="sub">Lopen · rennen · springen · werpen</div><button id="startButton" aria-label="Start intro"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.8c0-.8.9-1.3 1.6-.9l11 6.8a1.5 1.5 0 0 1 0 2.6l-11 6.8c-.7.4-1.6-.1-1.6-.9z"/></svg></button></div></div>
<button id="skip" aria-label="Intro overslaan">»</button>
<div id="hint" aria-live="polite"></div>
<button id="throw" aria-label="Gooi steen"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 23c3-1 4-6 8-8 3-2 7-7 10-5l5 7-2 7-9 3-9-1z" fill="#c7ae7b" stroke="#f7e7bd" stroke-width="1.5" stroke-linejoin="round"/><path d="m10 22 7-7m-1 8 8-8" stroke="#907954" stroke-width="1.3" stroke-linecap="round"/><path d="M3 9c4-3 8-4 12-3" fill="none" stroke="#fff0be" stroke-width="1.5" stroke-linecap="round"/></svg></button>
<script>
(()=> {
const cv=document.getElementById('game'),c=cv.getContext('2d',{alpha:false});
const title=document.getElementById('title'),startButton=document.getElementById('startButton'),skipButton=document.getElementById('skip'),throwButton=document.getElementById('throw'),hint=document.getElementById('hint');
let W=innerWidth,H=innerHeight,DPR=1,baseY=0,cam=0,time=0,last=0,mode='title',leftId=null,rightId=null,keys={},axis=0,running=false,jumpQueued=false,throwQueued=false,stepIndex=0,stepTimer=0,leftDone=false,rightDone=false,runDone=false,jumpDone=false,throwDone=false,showHintUntil=0;
const WORLD=6200,GAP_A=1850,GAP_B=2110;
const hero={x:165,y:0,w:54,h:82,vy:0,ground:true,face:1,walk:0,run:0,throw:0,jumpFromRun:false};
let stones=[],dust=[],audio=null,lastFoot=0;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);c.setTransform(DPR,0,0,DPR,0,0);baseY=H*.79;if(hero.ground)hero.y=groundAt(hero.x)-hero.h}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,120));if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);resize();
function groundAt(x){return baseY+Math.sin(x*.0025)*4+Math.sin(x*.0062+1)*2}
function inGap(x){return x>GAP_A&&x<GAP_B}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function sfx(kind){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.connect(g);g.connect(audio.destination);o.type=kind==='throw'?'triangle':'sine';let f=kind==='jump'?270:kind==='throw'?540:kind==='hit'?170:110;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*(kind==='throw'?1.45:.58)),now+.12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='step'?.035:.055,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.17);o.start(now);o.stop(now+.18)}catch{}}
function say(text,seconds=1.8){hint.textContent=text;hint.classList.add('show');showHintUntil=time+seconds}
function begin(){title.classList.add('off');mode='intro';skipButton.style.display='grid';throwButton.style.display='grid';time=0;last=performance.now();hero.x=165;hero.y=groundAt(hero.x)-hero.h;hero.vy=0;hero.ground=true;cam=0;stepIndex=0;leftDone=rightDone=runDone=jumpDone=throwDone=false;stones=[];say('Sleep links en rechts',3);sfx('jump')}
startButton.addEventListener('pointerdown',e=>{e.preventDefault();begin()});
skipButton.addEventListener('pointerdown',e=>{e.preventDefault();mode='free';skipButton.style.display='none';hint.classList.remove('show')});
throwButton.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();throwQueued=true;sfx('throw')});
function startPointer(e){if(mode==='title'||mode==='dead')return;if(e.target===throwButton||e.target===skipButton)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const x=e.clientX;if(x<W*.54&&leftId===null){leftId=e.pointerId;leftOriginX=x;leftOriginY=e.clientY;axis=0;running=false}else if(x>=W*.54){rightId=e.pointerId;jumpQueued=true}}
let leftOriginX=0,leftOriginY=0;
function movePointer(e){if(e.pointerId===leftId){const dx=e.clientX-leftOriginX,up=leftOriginY-e.clientY;let v=Math.abs(dx)<9?0:clamp(dx/38,-1,1);if(up>28&&v<0)v=0;axis=v;running=up>28&&v>.12;if(running)runDone=true;if(v<-.15)leftDone=true;if(v>.15)rightDone=true}}
function endPointer(e){if(e.pointerId===leftId){leftId=null;axis=0;running=false}if(e.pointerId===rightId)rightId=null}
cv.addEventListener('pointerdown',startPointer);cv.addEventListener('pointermove',movePointer);cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);cv.addEventListener('lostpointercapture',endPointer);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowup',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '||e.key==='arrowup')jumpQueued=true;if(e.key.toLowerCase()==='x'||e.key.toLowerCase()==='e')throwQueued=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function controls(){if(leftId===null){axis=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);running=(keys.arrowup||keys.w)&&axis>0;if((keys.arrowup||keys.w)&&axis<0)axis=0}return}
function drawCloud(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#fff4d9a6';c.beginPath();c.ellipse(0,5,45,12,0,0,Math.PI*2);c.ellipse(-25,3,23,13,0,0,Math.PI*2);c.ellipse(3,-4,29,18,0,0,Math.PI*2);c.ellipse(29,2,25,14,0,0,Math.PI*2);c.fill();c.restore()}
const farPeaks=[[-500,0],[-220,66],[40,17],[310,98],[570,34],[820,116],[1110,42],[1380,87],[1680,24],[1950,106],[2230,41],[2500,92],[2780,20],[3080,105],[3370,36],[3650,92],[3930,29],[4210,115],[4490,42],[4780,85],[5100,23],[5410,108],[5700,38],[6000,95],[6350,25],[6650,100]];
function drawRidge(parallax,yBase,color,alpha){c.save();c.globalAlpha=alpha;c.fillStyle=color;c.beginPath();c.moveTo(-20,H);for(let i=0;i<farPeaks.length;i++){const [wx,peak]=farPeaks[i],x=wx-cam*parallax,y=yBase-peak*(H/440);if(i===0)c.lineTo(x,y);else{const [px,pp]=farPeaks[i-1],xx=px-cam*parallax,yy=yBase-pp*(H/440),mid=(xx+x)/2;c.quadraticCurveTo(mid,yy,mid,(yy+y)/2);c.quadraticCurveTo(mid,y, x,y)}}c.lineTo(W+30,H);c.closePath();c.fill();c.restore()}
function drawTree(wx,depth,scale,variant){const x=wx-cam*depth;if(x<-230||x>W+230)return;const gy=groundAt(wx),h=(105+variant*13)*scale*(H/410),cx=x,top=gy-h,tw=scale;
 const trunk=c.createLinearGradient(cx-12,0,cx+14,0);trunk.addColorStop(0,'#68452e');trunk.addColorStop(.43,'#a87849');trunk.addColorStop(1,'#5e422e');
 c.fillStyle=trunk;c.beginPath();c.moveTo(cx-10*tw,gy);c.bezierCurveTo(cx-4*tw,top+55,cx-9*tw,top+23,cx-3*tw,top);c.quadraticCurveTo(cx+2*tw,top-4,cx+5*tw,top+6);c.bezierCurveTo(cx+11*tw,top+35,cx+7*tw,top+56,cx+14*tw,gy);c.closePath();c.fill();
 c.strokeStyle='#795238';c.lineWidth=5*tw;c.lineCap='round';c.beginPath();c.moveTo(cx+1,top+48);c.quadraticCurveTo(cx-26*tw,top+20,cx-48*tw,top+9);c.moveTo(cx+4,top+40);c.quadraticCurveTo(cx+32*tw,top+17,cx+58*tw,top+3);c.moveTo(cx-3,top+31);c.quadraticCurveTo(cx-8*tw,top+12,cx-5*tw,top-2);c.stroke();
 const colors=[['#496f3a','#739449','#a6b85b'],['#52783d','#829c4b','#bec86a'],['#456c3c','#6f9148','#adc160']][variant%3];
 const canopy=c.createRadialGradient(cx-28*tw,top-18*tw,5,cx,top,105*tw);canopy.addColorStop(0,colors[2]);canopy.addColorStop(.48,colors[1]);canopy.addColorStop(1,colors[0]);c.fillStyle=canopy;
 c.beginPath();c.moveTo(cx-106*tw,top+2);c.bezierCurveTo(cx-98*tw,top-25*tw,cx-76*tw,top-39*tw,cx-48*tw,top-32*tw);c.bezierCurveTo(cx-30*tw,top-67*tw,cx+18*tw,top-61*tw,cx+37*tw,top-37*tw);c.bezierCurveTo(cx+74*tw,top-51*tw,cx+106*tw,top-26*tw,cx+112*tw,top+1);c.bezierCurveTo(cx+96*tw,top+27*tw,cx+59*tw,top+28*tw,cx+29*tw,top+20*tw);c.bezierCurveTo(cx-8*tw,top+34*tw,cx-83*tw,top+26*tw,cx-106*tw,top+2);c.fill();
 c.fillStyle='#d7d27b55';for(let k=0;k<5;k++){let lx=cx+(-74+k*35)*tw,ly=top-15+(k%2)*12;c.beginPath();c.ellipse(lx,ly,10*tw,3.4*tw,-.14,0,Math.PI*2);c.fill()}
}
const trees=[{x:110,d:.32,s:.72,v:0},{x:510,d:.45,s:1.03,v:1},{x:945,d:.35,s:.77,v:2},{x:1390,d:.48,s:1.1,v:0},{x:2270,d:.35,s:.78,v:1},{x:2660,d:.46,s:1.04,v:2},{x:3150,d:.32,s:.76,v:0},{x:3590,d:.47,s:1.14,v:1},{x:4110,d:.34,s:.8,v:2},{x:4520,d:.46,s:1.03,v:0},{x:5100,d:.34,s:.8,v:1},{x:5540,d:.47,s:1.14,v:2},{x:5980,d:.34,s:.8,v:0},{x:6420,d:.46,s:1.08,v:1}];
const herd=[{x:690,y:.66,s:.62,v:0},{x:770,y:.68,s:.76,v:1},{x:870,y:.65,s:.67,v:2},{x:2520,y:.67,s:.7,v:1},{x:2610,y:.65,s:.85,v:0},{x:2730,y:.68,s:.65,v:2}];
function drawAntelope(a){const wx=((a.x+time*34)%6800),x=wx-cam*.34,y=H*a.y;const scale=a.s*(H/410),phase=time*8+wx*.017;let stride=Math.sin(phase)*5;const coat=['#91633d','#a57345','#795638'][a.v];c.save();c.translate(x,y);c.scale(scale,scale);c.fillStyle='#49392c55';c.beginPath();c.ellipse(0,14,22,4,0,0,7);c.fill();
 c.fillStyle=coat;c.beginPath();c.moveTo(-20,0);c.quadraticCurveTo(-17,-13,-3,-13);c.quadraticCurveTo(8,-14,13,-7);c.lineTo(19,-5);c.lineTo(17,-1);c.lineTo(8,1);c.quadraticCurveTo(-5,8,-20,0);c.fill();
 c.beginPath();c.moveTo(6,-8);c.quadraticCurveTo(14,-14,15,-24);c.lineTo(19,-26);c.lineTo(21,-22);c.lineTo(18,-10);c.closePath();c.fill();c.beginPath();c.ellipse(21,-24,5,3,-.2,0,7);c.fill();
 c.strokeStyle='#55412d';c.lineWidth=1.5;c.lineCap='round';c.beginPath();c.moveTo(20,-26);c.quadraticCurveTo(25,-35,22,-40);c.moveTo(23,-26);c.quadraticCurveTo(29,-32,27,-37);c.stroke();
 c.strokeStyle='#59432f';c.lineWidth=2.1;for(const lx of [-13,-4,7,13]){let phaseLeg=stride*(lx%2?1:-1);c.beginPath();c.moveTo(lx,0);c.quadraticCurveTo(lx+phaseLeg*.4,6,lx+phaseLeg,13);c.stroke()}c.strokeStyle='#67472e';c.beginPath();c.moveTo(-19,-4);c.quadraticCurveTo(-28,-9,-30,-4);c.stroke();c.restore()}
function drawGround(){const gapL=GAP_A-cam,gapR=GAP_B-cam,gy=baseY;
 const fillSegment=(x1,x2)=>{if(x2<0||x1>W)return;x1=clamp(x1,0,W);x2=clamp(x2,0,W);if(x2<=x1)return;c.beginPath();c.moveTo(x1,gy);for(let x=x1;x<=x2+4;x+=18){const wx=x+cam;c.lineTo(x,groundAt(wx))}c.lineTo(x2,gy+H);c.lineTo(x1,gy+H);c.closePath();const g=c.createLinearGradient(0,gy,0,H);g.addColorStop(0,'#9a7847');g.addColorStop(.12,'#876543');g.addColorStop(1,'#554637');c.fillStyle=g;c.fill();c.save();c.beginPath();c.rect(x1,gy,x2-x1,H-gy);c.clip();
 for(let i=0;i<100;i++){let wx=i*83+17,x=wx-cam*.91;if(x<x1||x>x2)continue;const y=gy+18+(i*29%Math.max(24,H-gy-22));c.strokeStyle=i%3?'#b0935a55':'#d1ad6855';c.lineWidth=1.2;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+8,y-3,x+16,y+1);c.stroke()}c.restore();
 c.strokeStyle='#c3be67';c.lineWidth=5;c.beginPath();c.moveTo(x1,gy);for(let x=x1;x<=x2+4;x+=16)c.lineTo(x,groundAt(x+cam));c.stroke();c.strokeStyle='#e5d47b';c.lineWidth=1.3;c.stroke()};
 fillSegment(0,gapL);fillSegment(gapR,W);
 if(gapL>=-30&&gapL<=W+30){const edge=clamp(gapL,0,W);c.fillStyle='#775637';c.beginPath();c.moveTo(edge-3,gy-4);c.lineTo(edge+14,gy+30);c.lineTo(edge+28,gy+58);c.lineTo(edge+40,gy+88);c.lineTo(edge+54,gy+110);c.lineTo(edge-3,gy+110);c.closePath();c.fill();for(let k=0;k<4;k++){c.strokeStyle='#c09b60';c.lineWidth=2;c.beginPath();c.moveTo(edge+4,gy+18+k*22);c.quadraticCurveTo(edge+18,gy+25+k*22,edge+30,gy+27+k*22);c.stroke()}}
 if(gapR>=-30&&gapR<=W+30){const edge=clamp(gapR,0,W);c.fillStyle='#775637';c.beginPath();c.moveTo(edge+3,gy-4);c.lineTo(edge-13,gy+28);c.lineTo(edge-27,gy+57);c.lineTo(edge-42,gy+84);c.lineTo(edge-55,gy+110);c.lineTo(edge+4,gy+110);c.closePath();c.fill();for(let k=0;k<4;k++){c.strokeStyle='#c09b60';c.lineWidth=2;c.beginPath();c.moveTo(edge-3,gy+17+k*22);c.quadraticCurveTo(edge-18,gy+25+k*22,edge-32,gy+27+k*22);c.stroke()}}
}
function drawBackground(){const sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5ca9ca');sky.addColorStop(.43,'#a8d8ca');sky.addColorStop(.76,'#f0d79a');sky.addColorStop(1,'#dfb777');c.fillStyle=sky;c.fillRect(0,0,W,H);
 const sunX=W*.74-cam*.025,sunY=H*.22,glow=c.createRadialGradient(sunX,sunY,2,sunX,sunY,H*.28);glow.addColorStop(0,'#fff7cfbb');glow.addColorStop(.22,'#ffeaa877');glow.addColorStop(1,'#ffeaa800');c.fillStyle=glow;c.fillRect(0,0,W,H*.8);c.fillStyle='#fff1bd';c.beginPath();c.arc(sunX,sunY,H*.054,0,Math.PI*2);c.fill();
 for(let i=0;i<5;i++){let x=((i*W*.37-time*(5+i))%(W+180)+W+180)%(W+180)-90;drawCloud(x,H*(.12+(i%3)*.08),.7+(i%3)*.16)}
 drawRidge(.08,H*.67,'#8fa99b',.64);drawRidge(.14,H*.72,'#7c9478',.77);
 // Open Rift grassland, long rolling bands with soft haze
 c.fillStyle='#91ad76';c.beginPath();c.moveTo(0,H*.68);for(let x=0;x<=W+8;x+=22)c.lineTo(x,H*.68+Math.sin((x+cam*.19)*.005)*H*.025+Math.sin((x+cam*.19)*.014)*H*.009);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
 c.fillStyle='#c0bc6d';c.beginPath();c.moveTo(0,H*.76);for(let x=0;x<=W+8;x+=20)c.lineTo(x,H*.76+Math.sin((x+cam*.29)*.007+1)*H*.014);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
 // Low distant shrubs and seasonal water occupy different, non-repeating places
 const waterX=1240-cam*.31;if(waterX>-280&&waterX<W+300){c.fillStyle='#65b7bcaa';c.beginPath();c.ellipse(waterX,H*.735,190,H*.018,-.015,0,Math.PI*2);c.fill();c.fillStyle='#d4eee0aa';c.beginPath();c.ellipse(waterX-20,H*.729,47,2,0,0,Math.PI*2);c.fill()}
 for(const t of trees.filter(t=>t.d<.4))drawTree(t.x,t.d,t.s*.92,t.v);
 for(const a of herd)drawAntelope(a);
 for(const t of trees.filter(t=>t.d>=.4))drawTree(t.x,t.d,t.s,t.v);
 // Foreground grasses, moving in the wind, anchored to the world
 for(let i=0;i<155;i++){const wx=i*47+(i*37%31),x=wx-cam*.87;if(x<-8||x>W+8)continue;const gy=groundAt(wx),height=(8+(i*19%20))*(H/410),wind=Math.sin(time*2.3+i*.7)*3;c.strokeStyle=i%5===0?'#dfc761':'#778f43';c.lineWidth=i%4===0?1.7:1.1;c.beginPath();c.moveTo(x,gy+1);c.quadraticCurveTo(x-3+wind,gy-height*.55,x+wind,gy-height);c.stroke()}
 // A few close leaves frame the foreground without covering the player
 for(let i=0;i<8;i++){let wx=i*870+210,x=wx-cam*.78;if(x<-80||x>W+80)continue;const y=baseY-4;c.fillStyle=i%2?'#688646':'#7c9347';c.beginPath();c.ellipse(x,y,29,8,-.12,0,Math.PI*2);c.ellipse(x-16,y-5,18,8,-.38,0,Math.PI*2);c.ellipse(x+17,y-4,21,8,.32,0,Math.PI*2);c.fill()}

function stroke(points,color,width){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)c.lineTo(points[i][0],points[i][1]);c.stroke()}
function drawHero(){const pace=axis<-.1?Math.abs(axis)*.65:Math.abs(axis),phase=hero.walk,air=!hero.ground;let bob=air?0:Math.abs(Math.sin(phase*2))*(running?3.2:1.5);if(!pace)bob=Math.sin(time*2.3)*1.1;
 const screenX=hero.x-cam,top=hero.y+bob,scale=H/410;c.save();c.translate(screenX,top);c.scale((hero.face<0?-1:1)*scale,scale);
 // soft contact shadow

 }else{
  stroke([[-7,48],[-12+stride*.42,61],[-14+stride,75]],'#4b372a',10);stroke([[-7,48],[-12+stride*.42,61],[-14+stride,75]],'#896345',6);
  stroke([[7,47],[12-stride*.42,61],[12-stride,76]],'#3e3027',11);stroke([[7,47],[12-stride*.42,61],[12-stride,76]],'#a16e47',7);
 }
 // feet: broad and bare
 c.fillStyle='#33271f';c.beginPath();c.ellipse(-14+stride,77,10,4,.1,0,Math.PI*2);c.ellipse(12-stride,78,11,4,-.05,0,Math.PI*2);c.fill();
 c.fillStyle='#684832';c.beginPath();c.moveTo(-12,27);c.quadraticCurveTo(-27,39,-20,55);c.quadraticCurveTo(-15,68,-3,67);c.lineTo(15,58);c.quadraticCurveTo(24,48,15,32);c.quadraticCurveTo(5,23,-12,27);c.closePath();c.fill();
 const torso=c.createLinearGradient(-22,30,22,59);torso.addColorStop(0,'#bf8753');torso.addColorStop(.46,'#95613f');torso.addColorStop(1,'#68462f');c.fillStyle=torso;c.beginPath();c.moveTo(-13,27);c.quadraticCurveTo(-26,33,-23,45);c.quadraticCurveTo(-18,59,-9,61);c.quadraticCurveTo(7,65,19,54);c.quadraticCurveTo(25,45,17,31);c.quadraticCurveTo(5,23,-13,27);c.fill();
 // shoulder and chest light, fur edge
 c.fillStyle='#d2a06a';c.beginPath();c.moveTo(-17,34);c.quadraticCurveTo(-7,28,2,33);c.quadraticCurveTo(5,42,-2,52);c.quadraticCurveTo(-10,51,-17,44);c.closePath();c.fill();
 c.strokeStyle='#d5a16b';c.lineWidth=2;c.beginPath();c.moveTo(-20,39);c.lineTo(-24,43);c.moveTo(-19,47);c.lineTo(-22,50);c.moveTo(18,44);c.lineTo(22,48);c.stroke();
 // fur wrap at waist, natural leaf-like shape
 c.fillStyle='#55402c';c.beginPath();c.moveTo(-14,54);c.quadraticCurveTo(-2,59,18,52);c.lineTo(22,66);c.quadraticCurveTo(5,72,-12,65);c.closePath();c.fill();c.fillStyle='#9a7044';c.beginPath();c.moveTo(-9,59);c.quadraticCurveTo(2,63,15,57);c.lineTo(17,63);c.quadraticCurveTo(3,69,-8,64);c.fill();
 // arms swing in opposite rhythm; throwing arm drives forward
 const swing=air?0:Math.sin(phase+Math.PI)* (running?13:8);
 stroke([[-17,33],[-27-swing*.38,43],[-26-swing,54]],'#553a2d',11);stroke([[-17,33],[-27-swing*.38,43],[-26-swing,54]],'#ae774d',7);
 if(hero.throw>0){let q=1-hero.throw/.28;stroke([[14,33],[19+q*12,37-q*9],[32+q*16,27-q*5]],'#50382a',11);stroke([[14,33],[19+q*12,37-q*9],[32+q*16,27-q*5]],'#bd8555',7)}
 else{stroke([[15,33],[23+swing*.35,43],[22+swing,54]],'#50372a',11);stroke([[15,33],[23+swing*.35,43],[22+swing,54]],'#c28b57',7)}
 // hands and fingers
 c.fillStyle='#b77d50';c.beginPath();c.ellipse(-26-swing,55,6,5,.2,0,Math.PI*2);c.ellipse(hero.throw>0?31:22+swing,54,6,5,.2,0,Math.PI*2);c.fill();
 // neck
 c.fillStyle='#aa744d';c.beginPath();c.roundRect(-2,18,14,17,5);c.fill();
 // head, low sloping brow and muzzle
 const skin=c.createLinearGradient(-8,0,29,27);skin.addColorStop(0,'#c08a5d');skin.addColorStop(.7,'#ae754b');skin.addColorStop(1,'#795039');c.fillStyle=skin;c.beginPath();c.moveTo(-14,13);c.quadraticCurveTo(-15,2,-6,-3);c.quadraticCurveTo(6,-9,17,-1);c.quadraticCurveTo(23,4,20,11);c.lineTo(29,16);c.quadraticCurveTo(31,20,24,23);c.lineTo(9,25);c.quadraticCurveTo(-5,23,-14,13);c.fill();
 // cheek, muzzle, nostril
 c.fillStyle='#d5a071';c.beginPath();c.ellipse(16,17,12,6,.1,0,Math.PI*2);c.fill();c.fillStyle='#754c35';c.beginPath();c.ellipse(27,16,2.1,1.5,0,0,Math.PI*2);c.fill();
 // brow, eye, hair
 c.fillStyle='#302822';c.beginPath();c.moveTo(-15,8);c.quadraticCurveTo(-17,-4,-8,-9);c.quadraticCurveTo(-2,-16,5,-10);c.quadraticCurveTo(11,-13,18,-6);c.lineTo(20,1);c.quadraticCurveTo(7,-3,-2,1);c.lineTo(-6,12);c.closePath();c.fill();
 c.fillStyle='#523a2d';c.beginPath();c.moveTo(3,5);c.quadraticCurveTo(10,2,18,6);c.lineTo(17,9);c.quadraticCurveTo(9,7,3,9);c.fill();
 c.fillStyle='#f8dfb0';c.beginPath();c.ellipse(11,8,2.8,2.3,0,0,Math.PI*2);c.fill();c.fillStyle='#211b17';c.beginPath();c.arc(12,8,1.2,0,Math.PI*2);c.fill();
 // cheek and ear give face dimensionality
 c.fillStyle='#8e5c3e';c.beginPath();c.ellipse(-8,12,4.3,6,0,0,Math.PI*2);c.fill();c.fillStyle='#c38a5c';c.beginPath();c.ellipse(-8,12,2,3,0,0,Math.PI*2);c.fill();
 // tufts, subtle fur strokes
 c.strokeStyle='#e0ae72';c.lineWidth=1.2;c.beginPath();c.moveTo(-15,31);c.quadraticCurveTo(-21,34,-22,38);c.moveTo(-17,46);c.quadraticCurveTo(-22,49,-21,53);c.moveTo(11,56);c.quadraticCurveTo(16,60,16,64);c.stroke();

}
function throwStone(){const direction=hero.face,launchX=hero.x+direction*28,launchY=hero.y+34;stones.push({x:launchX,y:launchY,vx:direction*(running?560:470),vy:-250,spin:0,life:3});hero.throw=.28;sfx('throw')}
function update(dt){time+=dt;controls();const speed=running?325:axis<-.1?132:188;hero.x+=axis*speed*dt;hero.x=clamp(hero.x,60,WORLD-100);if(axis>.08)hero.face=1;if(axis<-.08)hero.face=-1;hero.walk+=dt*(running?13:7)*Math.abs(axis||.12);hero.run=running?1:0;
 if(jumpQueued&&hero.ground){hero.jumpFromRun=running;hero.vy=running?-625:-475;hero.ground=false;sfx('jump');if(running)jumpDone=true}jumpQueued=false;
 if(throwQueued){throwStone();throwDone=true}throwQueued=false;
 hero.vy+=1420*dt;hero.y+=hero.vy*dt;
 let floorY=inGap(hero.x+hero.w*.45)?null:groundAt(hero.x);
 if(floorY!==null&&hero.y+hero.h>=floorY&&hero.vy>=0){hero.y=floorY-hero.h;hero.vy=0;hero.ground=true}else hero.ground=false;
 if(inGap(hero.x+hero.w*.5)&&hero.y>baseY+95){hero.x=GAP_A-hero.w-34;hero.y=groundAt(hero.x)-hero.h;hero.vy=0;hero.ground=true;say('Rechts + omhoog, dan springen',2.3)}
 hero.throw=Math.max(0,hero.throw-dt);
 if(Math.abs(axis)>.2&&hero.ground&&time-lastFoot>(running ? 0.23 : 0.34)){sfx('step');lastFoot=time}
 for(const s of stones){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=760*dt;s.spin+=dt*9;s.life-=dt;let gy=groundAt(s.x);if(s.y>gy-8){s.y=gy-8;s.vy*=-.32;s.vx*=.7;if(Math.abs(s.vy)<55)s.life=0;for(let k=0;k<3;k++)dust.push({x:s.x,y:gy-4,vx:(Math.random()-.5)*45,vy:-Math.random()*35,life:.35,color:k%2?'#d8c37f':'#f1dea0'});sfx('hit')}}stones=stones.filter(s=>s.life>0);
 for(const p of dust){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt}dust=dust.filter(p=>p.life>0);
 if(mode==='intro'){if(stepIndex===0&&leftDone&&rightDone){say('Rechts + omhoog = rennen',2.3);stepIndex=1;leftDone=rightDone=false}else if(stepIndex===1&&runDone){say('Tik rechts om te springen',2.2);stepIndex=2}else if(stepIndex===2&&jumpDone){say('Ren naar de kloof',2.2);stepIndex=3}else if(stepIndex===3&&hero.x>GAP_A-430){say('Ren + spring over de kloof',2.4);stepIndex=4}else if(stepIndex===4&&jumpDone&&hero.x>GAP_A-120){say('Werpen kan met het kleine icoon',2.4);stepIndex=5}else if(stepIndex===5&&throwDone){say('Vrij oefenen',2.4);stepIndex=6;mode='free';skipButton.style.display='none'} }
 const target=clamp(hero.x-W*.39,0,WORLD-W);cam+=(target-cam)*Math.min(1,dt*7);
}
function drawStone(s){const x=s.x-cam;c.save();c.translate(x,s.y);c.rotate(s.spin);const g=c.createLinearGradient(-8,-7,8,8);g.addColorStop(0,'#ebddb8');g.addColorStop(.4,'#b9a37b');g.addColorStop(1,'#716248');c.fillStyle=g;c.beginPath();c.moveTo(-9,2);c.lineTo(-6,-6);c.lineTo(0,-8);c.lineTo(7,-4);c.lineTo(9,3);c.lineTo(4,7);c.lineTo(-5,6);c.closePath();c.fill();c.strokeStyle='#f6e8c2aa';c.lineWidth=1;c.stroke();c.restore()}
function draw(){drawBackground();for(const s of stones)drawStone(s);for(const p of dust){c.globalAlpha=clamp(p.life/.35,0,1);c.fillStyle=p.color;c.beginPath();c.arc(p.x-cam,p.y,2.1,0,Math.PI*2);c.fill()}c.globalAlpha=1;drawHero();if(hint.classList.contains('show')&&time>showHintUntil)hint.classList.remove('show')}
function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;if(mode!=='title')update(dt);else{time+=dt;drawIdle()}draw();requestAnimationFrame(frame)}
