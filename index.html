<!doctype html>
<html lang="nl">
<head>

<title>HOMO — de lange reis</title>
<style>
:root{color-scheme:dark;--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#15252a;touch-action:none;-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#title{position:fixed;inset:0;display:grid;place-items:center;z-index:3;background:linear-gradient(90deg,#10232955,#10232912 60%,#10232940);transition:opacity .55s ease}
#title.off{opacity:0;pointer-events:none}
.titleCard{width:min(440px,86vw);padding:20px 26px;text-align:center;background:linear-gradient(145deg,#10272bc9,#19322ca8);border:1px solid #f5dc9a99;border-radius:22px;box-shadow:0 18px 65px #10232955;backdrop-filter:blur(7px)}
.eyebrow{font-size:clamp(10px,1.8vh,13px);font-weight:850;letter-spacing:.22em;color:#f6cf75;text-transform:uppercase}
h1{margin:7px 0 3px;font-size:clamp(44px,11vh,78px);line-height:.92;letter-spacing:.04em;color:#fff0bb;text-shadow:0 4px #a45038,0 8px #352328}
.sub{margin:8px 0 14px;color:#e6e1c9;font-size:clamp(12px,2.1vh,15px)}
#startButton{width:54px;height:54px;border-radius:50%;border:1px solid #fff3c2;background:#f8c64cdd;color:#26302c;display:grid;place-items:center;margin:auto;box-shadow:0 6px 18px #0c171955;touch-action:none}
#startButton svg{width:22px;height:22px;margin-left:3px}
#skip{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:none;width:38px;height:38px;border-radius:50%;border:1px solid #fff8;background:#15272555;color:#fff0c8;font-size:23px;line-height:1;touch-action:none;backdrop-filter:blur(5px)}
#hint{position:fixed;z-index:2;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#17282455;color:#fff2d3;text-shadow:0 1px 5px #243024;font-weight:750;font-size:clamp(11px,1.8vh,14px);letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}
#score{display:none;position:fixed;z-index:2;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:7px 11px;border:1px solid #fff7;border-radius:15px;background:#1829249c;color:#fff1c9;font-size:clamp(11px,1.7vh,14px);font-weight:800;letter-spacing:.08em;text-shadow:0 1px 3px #222;pointer-events:none;backdrop-filter:blur(4px)}
#throw{position:fixed;z-index:2;right:max(20px,var(--safeR));bottom:max(18px,var(--safeB));width:48px;height:48px;border-radius:50%;border:1.5px solid #fff9;background:#273b3590;color:#fff0c8;display:none;place-items:center;padding:0;backdrop-filter:blur(4px);touch-action:none;box-shadow:0 4px 12px #1115}
#throw:active{transform:scale(.92);background:#f0bb5dbb}
#throw svg{width:24px;height:24px;filter:drop-shadow(0 1px 2px #14211c)}
@media(max-height:440px) and (orientation:landscape){.titleCard{padding:13px 22px;width:min(380px,74vw)}h1{font-size:clamp(40px,12vh,58px)}.sub{margin:6px 0 10px}#startButton{width:46px;height:46px}#throw{width:43px;height:43px}}
@media(orientation:portrait){#rotate{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#15252a;color:#f6e8bd;font-weight:800;font-size:20px;text-align:center;padding:24px}#rotate span{display:block;margin-top:8px;font-size:13px;color:#c5d2c4;font-weight:500}@media(orientation:portrait){#rotate{display:grid}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title"><div class="titleCard"><div class="eyebrow">Een bewegingsoefening in de Riftvallei</div><h1>HOMO</h1><div class="sub">Lopen · rennen · springen · werpen</div><button id="startButton" aria-label="Start intro"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.8c0-.8.9-1.3 1.6-.9l11 6.8a1.5 1.5 0 0 1 0 2.6l-11 6.8c-.7.4-1.6-.1-1.6-.9z"/></svg></button></div></div>
<button id="skip" aria-label="Intro overslaan">»</button>
<div id="hint" aria-live="polite"></div><div id="score" aria-live="polite">PUNTEN&nbsp; 0</div>
<button id="throw" aria-label="Gooi steen"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 23c3-1 4-6 8-8 3-2 7-7 10-5l5 7-2 7-9 3-9-1z" fill="#c7ae7b" stroke="#f7e7bd" stroke-width="1.5" stroke-linejoin="round"/><path d="m10 22 7-7m-1 8 8-8" stroke="#907954" stroke-width="1.3" stroke-linecap="round"/><path d="M3 9c4-3 8-4 12-3" fill="none" stroke="#fff0be" stroke-width="1.5" stroke-linecap="round"/></svg></button>
<div id="rotate">DRAAI JE TELEFOON LIGGEND<span>Deze bewegingsproef speel je liggend.</span></div>
<script>
(()=> {
const cv=document.getElementById('game'),c=cv.getContext('2d',{alpha:false});
const title=document.getElementById('title'),startButton=document.getElementById('startButton'),skipButton=document.getElementById('skip'),throwButton=document.getElementById('throw'),hint=document.getElementById('hint'),scoreDisplay=document.getElementById('score');
let W=innerWidth,H=innerHeight,DPR=1,baseY=0,cam=0,time=0,last=0,mode='title',leftId=null,rightId=null,keys={},axis=0,running=false,jumpQueued=false,throwQueued=false,stepIndex=0,stepTimer=0,leftDone=false,rightDone=false,runDone=false,jumpDone=false,runJumpDone=false,throwDone=false,showHintUntil=0;
const WORLD=6200,GAP_A=1850,GAP_B=2040;
const hero={x:165,y:0,w:54,h:82,vx:0,vy:0,ground:true,face:1,walk:0,run:0,throw:0,hurt:0,jumpFromRun:false};
const enemies=[{anchor:980,x:980,hp:2,stun:0,flee:0,fleeDir:1,face:-1,phase:0,gone:false},{anchor:2920,x:2920,hp:2,stun:0,flee:0,fleeDir:1,face:-1,phase:1.8,gone:false},{anchor:4770,x:4770,hp:2,stun:0,flee:0,fleeDir:1,face:-1,phase:3.4,gone:false}];
const birds=[{anchor:1580,x:1580,hp:1,phase:.3,cooldown:.8,diveT:0,diving:false,diveFrom:1580,diveTo:1580,altitude:150,face:-1,gone:false},{anchor:3560,x:3560,hp:1,phase:2.1,cooldown:1.6,diveT:0,diving:false,diveFrom:3560,diveTo:3560,altitude:155,face:-1,gone:false},{anchor:5160,x:5160,hp:1,phase:4.2,cooldown:.4,diveT:0,diving:false,diveFrom:5160,diveTo:5160,altitude:145,face:-1,gone:false}];
const cats=[{anchor:4020,x:4020,hp:1,gone:false,face:-1,phase:1.1,cooldown:1.5,pounce:0}];
const crocodiles=[{x:2360,submergedUntil:0,biteUntil:0}];
const fruitTrees=[{x:510,dropped:false},{x:2660,dropped:false},{x:4520,dropped:false}];
let score=0,fruitDrops=[];
let throwPointerId=null,throwStartY=0,throwAim=0;
let stones=[],dust=[],audio=null,lastFoot=0;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);c.setTransform(DPR,0,0,DPR,0,0);baseY=H*.79;hero.h=clamp(H*.20,70,94);hero.w=hero.h*.66;if(hero.ground)hero.y=groundAt(hero.x)-hero.h}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,120));if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);resize();
function groundAt(x){return baseY+Math.sin(x*.0025)*4+Math.sin(x*.0062+1)*2}
function inGap(x){return x>GAP_A&&x<GAP_B}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function changeScore(amount){score=Math.max(0,score+amount);scoreDisplay.innerHTML='PUNTEN&nbsp; '+score}
function sfx(kind){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.connect(g);g.connect(audio.destination);o.type=kind==='throw'?'triangle':'sine';let f=kind==='jump'?270:kind==='throw'?540:kind==='hit'?170:110;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*(kind==='throw'?1.45:.58)),now+.12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='step'?.035:.055,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.17);o.start(now);o.stop(now+.18)}catch{}}
function say(text,seconds=1.8){hint.textContent=text;hint.classList.add('show');showHintUntil=time+seconds}
function begin(){title.classList.add('off');mode='intro';scoreDisplay.style.display='block';skipButton.style.display='grid';throwButton.style.display='grid';time=0;last=performance.now();hero.x=165;hero.y=groundAt(hero.x)-hero.h;hero.vx=0;hero.vy=0;hero.hurt=0;hero.ground=true;cam=0;stepIndex=0;leftDone=rightDone=runDone=jumpDone=runJumpDone=throwDone=false;stones=[];fruitDrops=[];score=0;changeScore(0);for(const q of fruitTrees)q.dropped=false;for(const e of enemies){e.x=e.anchor;e.hp=2;e.stun=0;e.flee=0;e.gone=false}for(const b of birds){b.x=b.anchor;b.hp=1;b.gone=false;b.diving=false;b.diveT=0;b.altitude=150;b.cooldown=1.2;b.diveFrom=b.anchor;b.diveTo=b.anchor;b.phase=b.phase}for(const cat of cats){cat.x=cat.anchor;cat.hp=1;cat.gone=false;cat.pounce=0;cat.cooldown=1.5}for(const croc of crocodiles){croc.submergedUntil=0;croc.biteUntil=0}say('Sleep links en rechts',3);sfx('jump')}
startButton.addEventListener('pointerdown',e=>{e.preventDefault();begin()});
skipButton.addEventListener('pointerdown',e=>{e.preventDefault();mode='free';skipButton.style.display='none';hint.classList.remove('show')});
throwButton.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();throwPointerId=e.pointerId;throwStartY=e.clientY;throwAim=0;try{throwButton.setPointerCapture(e.pointerId)}catch{}});
throwButton.addEventListener('pointermove',e=>{if(e.pointerId===throwPointerId)throwAim=clamp((throwStartY-e.clientY)/110,0,1)});
throwButton.addEventListener('pointerup',e=>{if(e.pointerId===throwPointerId){throwQueued=true;throwPointerId=null}});
throwButton.addEventListener('pointercancel',e=>{if(e.pointerId===throwPointerId){throwQueued=true;throwPointerId=null}});
function startPointer(e){if(mode==='title'||mode==='dead')return;if(e.target===throwButton||e.target===skipButton)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const x=e.clientX;if(x<W*.54&&leftId===null){leftId=e.pointerId;leftOriginX=x;leftOriginY=e.clientY;axis=0;running=false}else if(x>=W*.54){rightId=e.pointerId;jumpQueued=true}}
let leftOriginX=0,leftOriginY=0;
function movePointer(e){if(e.pointerId===leftId){const dx=e.clientX-leftOriginX,up=leftOriginY-e.clientY;let v=Math.abs(dx)<9?0:clamp(dx/38,-1,1);axis=v;running=up>28&&Math.abs(v)>.12;if(running)runDone=true;if(v<-.15)leftDone=true;if(v>.15)rightDone=true}}
function endPointer(e){if(e.pointerId===leftId){leftId=null;axis=0;running=false}if(e.pointerId===rightId)rightId=null}
cv.addEventListener('pointerdown',startPointer);cv.addEventListener('pointermove',movePointer);cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);cv.addEventListener('lostpointercapture',endPointer);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowup',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '||e.key==='arrowup')jumpQueued=true;if(e.key.toLowerCase()==='x'||e.key.toLowerCase()==='e')throwQueued=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function controls(){if(leftId===null){axis=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);running=(keys.arrowup||keys.w)&&Math.abs(axis)>.08;}return}
function drawCloud(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#fff4d9a6';c.beginPath();c.ellipse(0,5,45,12,0,0,Math.PI*2);c.ellipse(-25,3,23,13,0,0,Math.PI*2);c.ellipse(3,-4,29,18,0,0,Math.PI*2);c.ellipse(29,2,25,14,0,0,Math.PI*2);c.fill();c.restore()}
const farPeaks=[[-500,0],[-220,66],[40,17],[310,98],[570,34],[820,116],[1110,42],[1380,87],[1680,24],[1950,106],[2230,41],[2500,92],[2780,20],[3080,105],[3370,36],[3650,92],[3930,29],[4210,115],[4490,42],[4780,85],[5100,23],[5410,108],[5700,38],[6000,95],[6350,25],[6650,100]];
function drawRidge(parallax,yBase,color,alpha){c.save();c.globalAlpha=alpha;c.fillStyle=color;c.beginPath();c.moveTo(-20,H);for(let i=0;i<farPeaks.length;i++){const [wx,peak]=farPeaks[i],x=wx-cam*parallax,y=yBase-peak*(H/440);if(i===0)c.lineTo(x,y);else{const [px,pp]=farPeaks[i-1],xx=px-cam*parallax,yy=yBase-pp*(H/440),mid=(xx+x)/2;c.quadraticCurveTo(mid,yy,mid,(yy+y)/2);c.quadraticCurveTo(mid,y, x,y)}}c.lineTo(W+30,H);c.closePath();c.fill();c.restore()}
function drawTree(wx,depth,scale,variant){const x=wx-cam*depth;if(x<-230||x>W+230)return;const gy=groundAt(wx),h=(105+variant*13)*scale*(H/410),cx=x,top=gy-h,tw=scale;
 const trunk=c.createLinearGradient(cx-12,0,cx+14,0);trunk.addColorStop(0,'#68452e');trunk.addColorStop(.43,'#a87849');trunk.addColorStop(1,'#5e422e');
 c.fillStyle=trunk;c.beginPath();c.moveTo(cx-10*tw,gy);c.bezierCurveTo(cx-4*tw,top+55,cx-9*tw,top+23,cx-3*tw,top);c.quadraticCurveTo(cx+2*tw,top-4,cx+5*tw,top+6);c.bezierCurveTo(cx+11*tw,top+35,cx+7*tw,top+56,cx+14*tw,gy);c.closePath();c.fill();
 c.strokeStyle='#795238';c.lineWidth=5*tw;c.lineCap='round';c.beginPath();c.moveTo(cx+1,top+48);c.quadraticCurveTo(cx-26*tw,top+20,cx-48*tw,top+9);c.moveTo(cx+4,top+40);c.quadraticCurveTo(cx+32*tw,top+17,cx+58*tw,top+3);c.moveTo(cx-3,top+31);c.quadraticCurveTo(cx-8*tw,top+12,cx-5*tw,top-2);c.stroke();
 const colors=[['#496f3a','#739449','#a6b85b'],['#52783d','#829c4b','#bec86a'],['#456c3c','#6f9148','#adc160']][variant%3];
 const canopy=c.createRadialGradient(cx-28*tw,top-18*tw,5,cx,top,105*tw);canopy.addColorStop(0,colors[2]);canopy.addColorStop(.48,colors[1]);canopy.addColorStop(1,colors[0]);c.fillStyle=canopy;
 c.beginPath();c.moveTo(cx-106*tw,top+2);c.bezierCurveTo(cx-98*tw,top-25*tw,cx-76*tw,top-39*tw,cx-48*tw,top-32*tw);c.bezierCurveTo(cx-30*tw,top-67*tw,cx+18*tw,top-61*tw,cx+37*tw,top-37*tw);c.bezierCurveTo(cx+74*tw,top-51*tw,cx+106*tw,top-26*tw,cx+112*tw,top+1);c.bezierCurveTo(cx+96*tw,top+27*tw,cx+59*tw,top+28*tw,cx+29*tw,top+20*tw);c.bezierCurveTo(cx-8*tw,top+34*tw,cx-83*tw,top+26*tw,cx-106*tw,top+2);c.fill();
 c.fillStyle='#d7d27b55';for(let k=0;k<5;k++){let lx=cx+(-74+k*35)*tw,ly=top-15+(k%2)*12;c.beginPath();c.ellipse(lx,ly,10*tw,3.4*tw,-.14,0,Math.PI*2);c.fill()}
}
const trees=[{x:110,d:.32,s:.72,v:0},{x:510,d:.45,s:1.03,v:1},{x:945,d:.35,s:.77,v:2},{x:1390,d:.48,s:1.1,v:0},{x:2270,d:.35,s:.78,v:1},{x:2660,d:.46,s:1.04,v:2},{x:3150,d:.32,s:.76,v:0},{x:3590,d:.47,s:1.14,v:1},{x:4110,d:.34,s:.8,v:2},{x:4520,d:.46,s:1.03,v:0},{x:5100,d:.34,s:.8,v:1},{x:5540,d:.47,s:1.14,v:2},{x:5980,d:.34,s:.8,v:0},{x:6420,d:.46,s:1.08,v:1}];
const herd=[{x:690,y:.66,s:.62,v:0},{x:770,y:.68,s:.76,v:1},{x:870,y:.65,s:.67,v:2},{x:2520,y:.67,s:.7,v:1},{x:2610,y:.65,s:.85,v:0},{x:2730,y:.68,s:.65,v:2}];
function drawAntelope(a){const wx=((a.x+time*34)%6800),x=wx-cam*.34,y=H*a.y;const scale=a.s*(H/410),phase=time*8+wx*.017;let stride=Math.sin(phase)*5;const coat=['#91633d','#a57345','#795638'][a.v];c.save();c.translate(x,y);c.scale(scale,scale);c.fillStyle='#49392c55';c.beginPath();c.ellipse(0,14,22,4,0,0,7);c.fill();
 c.fillStyle=coat;c.beginPath();c.moveTo(-20,0);c.quadraticCurveTo(-17,-13,-3,-13);c.quadraticCurveTo(8,-14,13,-7);c.lineTo(19,-5);c.lineTo(17,-1);c.lineTo(8,1);c.quadraticCurveTo(-5,8,-20,0);c.fill();
 c.beginPath();c.moveTo(6,-8);c.quadraticCurveTo(14,-14,15,-24);c.lineTo(19,-26);c.lineTo(21,-22);c.lineTo(18,-10);c.closePath();c.fill();c.beginPath();c.ellipse(21,-24,5,3,-.2,0,7);c.fill();
 c.strokeStyle='#55412d';c.lineWidth=1.5;c.lineCap='round';c.beginPath();c.moveTo(20,-26);c.quadraticCurveTo(25,-35,22,-40);c.moveTo(23,-26);c.quadraticCurveTo(29,-32,27,-37);c.stroke();
 c.strokeStyle='#59432f';c.lineWidth=2.1;for(const lx of [-13,-4,7,13]){let phaseLeg=stride*(lx%2?1:-1);c.beginPath();c.moveTo(lx,0);c.quadraticCurveTo(lx+phaseLeg*.4,6,lx+phaseLeg,13);c.stroke()}c.strokeStyle='#67472e';c.beginPath();c.moveTo(-19,-4);c.quadraticCurveTo(-28,-9,-30,-4);c.stroke();c.restore()}
function drawGround(){
 const gapL=GAP_A-cam,gapR=GAP_B-cam,gy=baseY,soilBottom=H+24;
 const fillSoil=(x1,x2)=>{
  if(x2<0||x1>W)return;x1=clamp(x1,0,W);x2=clamp(x2,0,W);if(x2<=x1)return;
  c.beginPath();c.moveTo(x1,gy);for(let x=x1;x<=x2+5;x+=14)c.lineTo(x,groundAt(x+cam));c.lineTo(x2,soilBottom);c.lineTo(x1,soilBottom);c.closePath();
  const earth=c.createLinearGradient(0,gy,0,soilBottom);earth.addColorStop(0,'#967348');earth.addColorStop(.12,'#805f3e');earth.addColorStop(.55,'#73583e');earth.addColorStop(1,'#514333');c.fillStyle=earth;c.fill();
  c.save();c.beginPath();c.rect(x1,gy,x2-x1,soilBottom-gy);c.clip();
  // Uneven sediment bands and fine roots, fixed to the landscape as it scrolls
  for(let i=0;i<23;i++){const wx=i*287+((i*79)%121)+85,x=wx-cam*.92;if(x<x1-30||x>x2+30)continue;const y=gy+18+(i*43%(Math.max(25,H-gy-30)));c.strokeStyle=i%3===0?'#c5a16a55':'#bd9b6650';c.lineWidth=i%4===0?2:1;c.beginPath();c.moveTo(x-13,y);c.quadraticCurveTo(x,y-3,x+19,y+1);c.stroke()}
  const things=[
   {x:265,t:'stone',dy:.21,s:9},{x:540,t:'stone',dy:.54,s:13},{x:850,t:'worm',dy:.34,s:1},
   {x:1115,t:'bone',dy:.25,s:1},{x:1450,t:'stone',dy:.61,s:11},{x:2330,t:'stone',dy:.31,s:12},
   {x:2740,t:'worm',dy:.48,s:1},{x:3100,t:'bone',dy:.2,s:1},{x:3490,t:'stone',dy:.65,s:15},
   {x:3880,t:'stone',dy:.28,s:8},{x:4240,t:'bone',dy:.43,s:1},{x:4660,t:'worm',dy:.25,s:1},
   {x:5040,t:'stone',dy:.55,s:12},{x:5480,t:'bone',dy:.3,s:1},{x:5860,t:'stone',dy:.24,s:10}
