<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<title>Oersprong 3D: proefstuk Riftvallei</title>
<style>
:root{--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark;
  --ink:#f4f2ec;--dim:#f4f2ec99;--faint:#f4f2ec55;--glass:#0c0f12c4;--glass2:#0c0f12f0;--line:#f4f2ec2e;--red:#ef4b4b;--sun:#ffc94a;--leaf:#8fd694;--sky:#8fd0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;background:#0c0f12;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.hud{position:fixed;z-index:3;pointer-events:none}

/* ---------- meters: dunne lijnen, geen balken ---------- */
#stats{top:max(12px,var(--sat));left:max(14px,var(--sal));display:grid;gap:4px;width:min(170px,36vw)}
.bar{height:4px;margin-bottom:5px;background:#0008;overflow:hidden;box-shadow:0 0 0 1px #0004}
.bar i{display:block;height:100%;width:50%;transition:width .3s}
#food{background:var(--sun)}#health{background:var(--red)}#group{background:var(--leaf)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 3px #000,0 0 8px #000a;display:flex;justify-content:space-between;color:var(--ink)}
#sick{display:none;color:#c9f28a}
.stat{opacity:0;transition:opacity .8s}
.stat.on{opacity:1;transition:opacity .25s}
#homeDir{fill:var(--ink);stroke:#0009}

/* ---------- melding: tekst op een donkere band, als een ondertitel ---------- */
#loading{bottom:max(18px,var(--sab));left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fffc;text-shadow:0 1px 3px #000}
#toast{top:max(12px,var(--sat));left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,58vw);text-align:center;font-weight:500;font-size:15px;line-height:1.4;padding:8px 34px;background:linear-gradient(90deg,transparent,#0c0f12cc 14%,#0c0f12cc 86%,transparent);text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#hint{bottom:calc(max(14px,var(--sab)) + 92px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(460px,70vw);text-align:center;font-size:14px;font-weight:500;line-height:1.35;padding:7px 16px;border-radius:999px;background:#0c0f12b3;box-shadow:inset 0 0 0 1px #f4f2ec33;text-shadow:0 1px 2px #000;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}
#homeEdge{left:0;top:0;display:none;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 3px #000;margin:-22px 0 0 -22px;width:44px}
#homeEdge svg{fill:#e39a4a;stroke:#000a;filter:drop-shadow(0 1px 3px #000a)}

/* ---------- knoppen ---------- */
.btn{font:inherit;border:0;border-radius:3px;font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#0c0f12;background:var(--ink);touch-action:manipulation;cursor:pointer;transition:transform .1s,background .2s}
.btn:active{transform:scale(.97);background:#fff}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.round{position:relative;display:grid;place-items:center;width:66px;height:66px;padding:16px;border:0;border-radius:50%;color:var(--ink);background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 14px #0006;cursor:pointer;touch-action:none;transition:background .2s,color .2s,transform .1s,opacity .2s}
.round svg{width:100%;height:100%}
.round:active{transform:scale(.94)}
.round.small{width:44px;height:44px;padding:11px}
.round.big{width:84px;height:84px;padding:20px}
.round.on{background:var(--ink);color:#0c0f12;box-shadow:0 0 0 1.5px #fff,0 4px 14px #0006}
#journalBtn em{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--ink);color:#0c0f12;font:700 11px/19px system-ui;font-style:normal;text-align:center}
#journalBtn span{width:100%;height:100%}
#doBtn{opacity:.5}
#doBtn.ready{opacity:1;background:var(--ink);color:#0c0f12;animation:glow 1.4s ease-in-out infinite}
#doBtn.danger{opacity:1;background:var(--red);color:#fff;animation:glowR .9s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #f4f2ec00,0 4px 14px #0006}50%{box-shadow:0 0 0 7px #f4f2ec44,0 4px 14px #0006}}
@keyframes glowR{0%,100%{box-shadow:0 0 0 0 #ef4b4b00,0 4px 14px #0006}50%{box-shadow:0 0 0 9px #ef4b4b66,0 4px 14px #0006}}
#topRight{top:max(10px,var(--sat));right:max(12px,var(--sar));display:flex;gap:10px;align-items:center;pointer-events:auto}
#menu{display:none;gap:10px}
#topRight.open #menu{display:flex}
#menuBtn{width:34px;height:34px;padding:8px;opacity:.45}
#topRight.open #menuBtn{opacity:1}
#act{right:max(16px,var(--sar));bottom:max(18px,var(--sab));pointer-events:auto}

/* ---------- handen ---------- */
#hands{bottom:calc(max(18px,var(--sab)) + 14px);right:calc(max(16px,var(--sar)) + 96px);display:flex;gap:8px;pointer-events:auto}
.hand{position:relative;width:56px;height:56px;border:0;border-radius:6px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 14px #0006;padding:10px;cursor:pointer;color:var(--ink)}
.hand{transition:opacity .5s}
.hand.empty{opacity:.28}
.hand .bg{position:absolute;inset:12px;transform:scaleX(-1)}
.hand.right .bg{transform:none}
.hand .it{position:absolute;inset:8px;filter:drop-shadow(0 2px 3px #0008)}
.hand svg{width:100%;height:100%}
.hand.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- stuurduim ---------- */
#joy{left:0;bottom:0;width:0;height:0}
#joy .ring{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #f4f2ec66;background:#0c0f1233;display:none}
#joy .knob{position:fixed;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#f4f2eccc;box-shadow:0 2px 10px #0006;display:none}
#joyHint{left:max(26px,var(--sal));bottom:max(26px,var(--sab));width:110px;height:110px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #f4f2ec44;opacity:.7;padding:32px;color:var(--ink)}

/* ---------- keuzerondje bij een ding ---------- */
#radial{left:0;top:0;width:0;height:0;pointer-events:auto}
#radial button{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;padding:14px;border:0;border-radius:50%;background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1.5px #f4f2ec66,0 6px 18px #0008;cursor:pointer;animation:pop .18s ease-out both}
#radial button svg{width:100%;height:100%}
#radial button i{position:absolute;right:-3px;top:-3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#0c0f12;font:700 13px/20px system-ui;font-style:normal}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- sluiers over het beeld ---------- */
#veil{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at center,transparent 45%,#3a5a10aa 100%)}
#senseVeil{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,transparent 45%,#0a1420cc 100%)}
#senseVeil.on{opacity:.55;transition:opacity 1.8s}
#hurt{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,#c01010cc 100%);transition:opacity .5s}
#weak{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,#a01010b0 100%);transition:opacity .6s}
#fade{position:fixed;inset:0;z-index:6;pointer-events:none;background:#000;opacity:0;transition:opacity 1.2s}

/* ---------- vensters ---------- */
.screen{position:fixed;inset:0;z-index:8;display:none;place-items:center;padding:16px;background:radial-gradient(ellipse at center,#0c0f1299,#0c0f12e6)}
.screen.open{display:grid}
.card{width:min(460px,100%);max-height:100%;overflow:auto;padding:22px 26px;border-radius:4px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line),0 24px 70px #000a;animation:rise .25s ease-out both}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card h2{margin:10px 0 10px;font-size:25px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
.card h3{margin:16px 0 4px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.card p{margin:7px 0;color:#f4f2ecd9;font-size:15px;line-height:1.5}
.card b{font-weight:600;color:#fff}
.card .know{color:var(--leaf)}
.card .q{color:var(--sun);font-style:italic}
.card .big{width:64px;height:64px;float:right;margin:0 0 6px 12px;filter:drop-shadow(0 3px 6px #0008)}
.card .fine{font-size:11px;color:var(--faint);line-height:1.45}
.card .fine a{color:var(--dim)}
.card .desk{font-size:13px;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.row .btn{padding:12px 34px}
ul{list-style:none;padding:0;margin:8px 0}
li{position:relative;margin:0;padding:6px 0 6px 16px;font-size:14px;line-height:1.4;color:#f4f2ecd9;border-top:1px solid #f4f2ec14}
li:first-child{border-top:0}
li::before{content:"";position:absolute;left:1px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
li.no{color:var(--faint)}
li.done{color:var(--dim)}li.done::marker{content:"✓  "}li.now{font-weight:600}
#quest{font-size:12px;line-height:1.3;color:var(--ink);text-shadow:0 1px 3px #000,0 0 8px #000a;margin-top:4px;opacity:0;transition:opacity .6s;display:flex;gap:6px;width:min(230px,46vw)}
#quest.on{opacity:.92}#quest b{color:#f0a030;font-weight:700;white-space:nowrap}#quest.flash{animation:questFlash 1.2s}
@keyframes questFlash{0%,60%{color:#f0a030;transform:scale(1.06);transform-origin:left}100%{transform:none}}
li.no::before{background:none;box-shadow:inset 0 0 0 1px var(--faint)}
@media (pointer:coarse){.desk{display:none}}
@media (max-height:500px){.screen{padding:8px}.card{padding:12px 20px;width:min(680px,100%)}.card h2{font-size:18px;margin:5px 0 3px}.card p{font-size:12.5px;line-height:1.4;margin:3px 0}li{font-size:12.5px;line-height:1.35;padding:3px 0 3px 16px}li::before{top:8px}ul{margin:3px 0}.row{margin-top:8px}.row .btn{padding:9px 30px}.card .fine{font-size:10px}}
@media (max-aspect-ratio:1/1){#toast{top:calc(max(10px,var(--sat)) + 96px);max-width:86vw}}

#rotate{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#0c0f12;text-align:center;padding:30px;font-weight:300;font-size:17px;letter-spacing:.12em;text-transform:uppercase;line-height:1.7}
#rotate svg{width:80px;height:80px;display:block;margin:0 auto 18px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
</style>
</head>
<body>
<div id="veil"></div>
<div id="senseVeil"></div>
<div id="fade"></div>
<div id="hurt"></div>
<div id="weak"></div>
<div id="rotate"><div><svg viewBox="0 0 48 48" fill="none" stroke="#f4f2ec" stroke-width="2.5" stroke-linejoin="round"><rect x="14" y="4" width="20" height="40" rx="4"/><path d="M21 38h6"/></svg>Draai je telefoon een kwartslag.<br>Dit spel speel je liggend.</div></div>
<div class="hud" id="stats">
  <div class="stat" id="statFood"><div class="lbl"><span>Voeding</span></div><div class="bar"><i id="food"></i></div></div>
  <div class="stat" id="statHealth"><div class="lbl"><span>Gezondheid</span><span id="sick">ziek</span></div><div class="bar"><i id="health"></i></div></div>
  <div class="stat" id="statGroup"><div class="lbl"><span>Groep</span><span id="dayLbl">Dag 1</span></div><div class="bar"><i id="group"></i></div></div>
  <div class="lbl stat" id="homeRow"><span>Slaapboom</span><span><svg id="homeDir" viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-3px" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l7 18-7-5-7 5z"/></svg> <span id="homeDist"></span></span></div>
  <div id="quest"><b id="questN"></b><span id="questT"></span></div>
</div>
<div class="hud" id="topRight">
  <div id="menu">
    <button class="round small" id="soundBtn" aria-label="Geluid aan of uit"></button>
    <button class="round small" id="journalBtn" aria-label="Wat je weet"><span id="journalIcon"></span><em id="journalCount">0</em></button>
  </div>
  <button class="round small" id="menuBtn" aria-label="Meer: geluid en wat je weet"></button>
</div>
<div class="hud" id="toast"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="homeEdge"><svg id="homeEdgeDir" viewBox="0 0 24 24" width="30" height="30" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l7 18-7-5-7 5z"/></svg><span id="homeEdgeDist"></span></div>
<div class="hud" id="hands">
  <button class="hand" id="hand0" aria-label="Linkerhand"></button>
  <button class="hand right" id="hand1" aria-label="Rechterhand"></button>
</div>
<div class="hud" id="joyHint"></div>
<div class="hud" id="joy"><div class="ring"></div><div class="knob"></div></div>
<div class="hud" id="act">
  <button class="round big" id="doBtn" aria-label="Slaan of gooien"></button>
</div>
<div class="hud" id="radial"></div>
<button class="round small" id="swap" aria-label="Ruilen" style="position:fixed;display:none;z-index:4;margin:-23px 0 0 -23px;pointer-events:auto"></button>

<div class="hud" id="loading">Laden…</div>
<template id="credits">Hoofdpersoon door gb.prof.69 met bewegingen van Quaternius (CC0); hyena en olifant door <a href="https://animalanimator.com">Animal Animator</a>, luipaard door GremorySaiyan, gazelle door kenchoo, sabeltandkat door slang107123456789, zebra door NoaSeller (Sketchfab, CC BY 4.0). Natuur: Poly Haven (CC0). <a href="assets/CREDITS.md">Alle bronnen</a></template>

<div class="screen" id="cardScreen"><div class="card" id="card"></div></div>

<script>
// Versie van deze uitrol (de uitrol vult ze in). Staat er online een nieuwere, dan laden we die: zo speel je nooit een oud spel.
window.__V = '__VERSION__'; window.__VA = '__ASSETS__';
(function () {
  if (__V[0] === '_') return;
  const check = () => fetch('./version.json?' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then((j) => {
    const atStart = !window.__played;
    if (j.v && j.v !== __V && atStart && !location.search.includes(j.v)) location.replace('./?v=' + j.v);
  }).catch(() => {});
  check(); document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
