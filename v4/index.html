<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<title>Oersprong 3D: proefstuk Riftvallei</title>
<style>
:root{--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark;
  --ink:#f4f2ec;--dim:#f4f2ec99;--faint:#f4f2ec55;--glass:#0c0f12c4;--glass2:#0c0f12f0;--line:#f4f2ec2e;--red:#ef4b4b;--sun:#ffc94a;--leaf:#8fd694;--sky:#8fd0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;background:#0c0f12;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
@font-face{font-family:Kool;src:url(assets/fonts/CabinSketch-Bold.woff2) format('woff2');font-display:swap}
.hud{position:fixed;z-index:3;pointer-events:none}

/* ---------- hoe het met je gaat: vier kleine tekens met een randje dat leegloopt. Gaat alles goed, dan zie je ze niet. ---------- */
#stats{top:max(10px,var(--sat));left:max(12px,var(--sal));display:flex;gap:7px;align-items:center}
.stat{position:relative;display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;color:var(--c,#f3e6cb);background:#2c2117b0;opacity:0;transition:opacity .8s;--v:50}
.stat::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),#f3e6cb26 0);-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,#0000 calc(100% - 3.5px),#000 calc(100% - 3px))}
.stat svg{width:56%;height:56%;filter:drop-shadow(0 1px 2px #000a)}
.stat.on{opacity:1;transition:opacity .25s}
.stat.low{animation:low 1.1s ease-in-out infinite}
@keyframes low{50%{transform:scale(1.14)}}
#statFood{--c:var(--sun)}#statWater{--c:#7fc3e6}#statHealth{--c:var(--red)}#statGroup{--c:var(--leaf)}#statSick{--c:#c9f28a;--v:0}
.stat.word{width:auto;height:26px;padding:0 9px 0 6px;border-radius:13px;display:flex;gap:5px;font-size:12px;font-weight:700;color:#f3e6cb;text-shadow:0 1px 2px #000}
.stat.word::before{display:none}.stat.word svg{width:17px;height:17px}
#homeDir{fill:var(--ink);stroke:#0009}

/* ---------- melding: tekst op een donkere band, als een ondertitel ---------- */
#loading{bottom:max(18px,var(--sab));left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fffc;text-shadow:0 1px 3px #000}
#toast{top:max(12px,var(--sat));left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,58vw);text-align:center;font-weight:500;font-size:15px;line-height:1.4;padding:8px 34px;background:linear-gradient(90deg,transparent,#0c0f12cc 14%,#0c0f12cc 86%,transparent);text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#toast.note{display:flex;align-items:center;gap:9px;padding:6px 30px;font-weight:700}#toast.note svg{width:24px;height:24px;color:#f0a030;filter:drop-shadow(0 1px 2px #000)}
#title{top:24%;left:50%;transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;padding:10px 60px;opacity:0;transition:opacity .8s;background:linear-gradient(90deg,transparent,#0c0f1299 22%,#0c0f1299 78%,transparent);text-shadow:0 2px 6px #000,0 0 14px #000a;z-index:4}
#title.on{opacity:1;transition:opacity .35s}#title i{display:block;font-style:normal;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#f0a030;font-weight:700}
#title b{display:block;font:400 clamp(26px,5.6vw,40px)/1.1 Kool,system-ui,sans-serif;margin:2px 0 4px}#title span{display:block;font-size:14px;opacity:.92}
.steps{margin:8px 0 14px;padding-left:20px;font-size:14px;line-height:1.5}.steps li{padding:4px 0 4px 4px;list-style:decimal;border:0}.steps li::before{display:none}.steps li.ok{opacity:.5;text-decoration:line-through}.steps li.now{color:var(--acc,#f0a030);font-weight:700}
#hint{bottom:calc(max(14px,var(--sab)) + 92px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(460px,70vw);text-align:center;font-size:14px;font-weight:500;line-height:1.35;padding:7px 16px;border-radius:999px;background:#0c0f12b3;box-shadow:inset 0 0 0 1px #f4f2ec33;text-shadow:0 1px 2px #000;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}
#homeEdge{left:0;top:0;display:none;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 3px #000;margin:-22px 0 0 -22px;width:44px}
#homeEdge svg{fill:#e39a4a;stroke:#000a;filter:drop-shadow(0 1px 3px #000a)}

/* ---------- knoppen ---------- */
.btn{font:inherit;border:0;border-radius:3px;font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#0c0f12;background:var(--ink);touch-action:manipulation;cursor:pointer;transition:transform .1s,background .2s}
.btn:active{transform:scale(.97);background:#fff}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
/* Eén soort knop voor het hele spel: een rechthoek met een kort woord. Vol wit = dit doe je nu of dit staat aan. */
.key{position:relative;height:48px;padding:0 14px;border:0;border-radius:3px;font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:var(--ink);background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 14px #0006;text-shadow:0 1px 3px #0008;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s,transform .1s,opacity .2s}
.key:active{transform:scale(.96)}
.key.on,.key.go,.key:active{background:var(--ink);color:#0c0f12;text-shadow:none}
.key em{font-style:normal;margin-left:6px;opacity:.7}.key em:empty{display:none}
.skin .key{box-shadow:inset 0 0 0 1.5px var(--line);text-shadow:none;border-radius:9px 12px 10px 13px/12px 9px 13px 10px}
.skin .key.on,.skin .key.go,.skin .key:active{background:var(--ink);color:var(--inv)}
.skin .btn{background:var(--ink);color:var(--inv);border-radius:9px 12px 10px 13px/12px 9px 13px 10px}.skin .btn.ghost,.skin .btn.alt{background:transparent;color:var(--ink)}
/* De knoppen in het spel zelf: ronde kiezels, half doorzichtig, met een teken erop. Ze horen bij de wereld, niet bij een app. */
.rb{position:relative;display:grid;place-items:center;width:54px;height:54px;padding:0;border:0;border-radius:52% 48% 50% 50%/49% 53% 47% 51%;color:#f3e6cb;background:radial-gradient(circle at 38% 30%,#6b543a8c,#2c2117a6 72%);box-shadow:inset 0 0 0 1.5px #ead3a23d,inset 0 -7px 12px #0003,0 3px 10px #0005;cursor:pointer;touch-action:manipulation;transition:opacity .22s,transform .22s,background .2s}
.rb svg{width:56%;height:56%;filter:drop-shadow(0 1px 2px #0009);pointer-events:none}
.rb:active{transform:scale(.93);background:radial-gradient(circle at 38% 30%,#8a6c48b0,#3a2c1ec4 72%)}
.rb.on{background:radial-gradient(circle at 38% 30%,#c9a56ab8,#7a5a34c4 72%)}
#doBtn{width:80px;height:80px;touch-action:none;box-shadow:inset 0 0 0 1.5px #ead3a260,inset 0 -9px 16px #0003,0 4px 14px #0006}
#doBtn.ready{background:radial-gradient(circle at 38% 30%,#d2ae72c4,#8a6534cc 72%);animation:glow 1.6s ease-in-out infinite}
#doBtn.danger{background:radial-gradient(circle at 38% 30%,#c4553ccc,#6e2416d0 72%);animation:glowR .9s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 1.5px #ead3a260,0 0 0 0 #e8c98a00}50%{box-shadow:inset 0 0 0 1.5px #ead3a290,0 0 0 7px #e8c98a38}}
@keyframes glowR{0%,100%{box-shadow:inset 0 0 0 1.5px #ffc9b060,0 0 0 0 #d8503000}50%{box-shadow:inset 0 0 0 1.5px #ffc9b0a0,0 0 0 9px #d8503055}}
/* een knop is er alleen als je er nu iets mee kunt */
#act .rb{opacity:0;transform:scale(.6);pointer-events:none}
#act .rb.show{opacity:1;transform:none;pointer-events:auto}
#act .rb.show:active{transform:scale(.93)}
#topRight{top:max(10px,var(--sat));right:max(12px,var(--sar));pointer-events:auto;display:flex}
#menuBtn{width:44px;height:44px;opacity:.7}
/* rechtsonder: je handen, je tas en wat je kunt doen. De hele hoek groeit of krimpt met de instelling 'Knoppen'. */
#pad{right:max(16px,var(--sar));bottom:max(18px,var(--sab));display:flex;align-items:flex-end;gap:80px;transform:scale(var(--u,1));transform-origin:100% 100%}
/* de grote knop in de hoek; wat je verder nog kunt doen staat er in een boog omheen, omhoog langs de rand */
#act{position:relative;width:80px;height:80px}
#act .alt{position:absolute;margin:-27px 0 0 -27px}
#alt0{left:40px;top:-52px}#alt1{left:-17px;top:-32px}#alt2{left:-52px;top:23px}

/* ---------- handen ---------- */
#hands{display:flex;gap:8px;pointer-events:auto}
.hand{position:relative;width:56px;height:56px;border:0;border-radius:50% 50% 48% 52%/53% 49% 51% 47%;background:radial-gradient(circle at 40% 32%,#6b543a80,#2c21179c 72%);box-shadow:inset 0 0 0 1.5px #ead3a238,inset 0 -7px 12px #0003,0 3px 10px #0005;padding:10px;cursor:pointer;color:#f3e6cb;touch-action:manipulation}
.hand{transition:opacity .5s}
.hand.empty{opacity:.28}.hand .palm{position:absolute;inset:14px;opacity:.55}#hand0 .palm{transform:scaleX(-1)}
.hand .it{position:absolute;inset:8px;filter:drop-shadow(0 2px 3px #0008)}
.hand svg{width:100%;height:100%}
.hand.shake{animation:shake .4s}
#bagBtn{width:56px;height:56px;margin-right:2px}#bagBtn em{position:absolute;right:3px;top:1px;min-width:17px;height:17px;border-radius:9px;background:#2c2117d9;font:700 11px/17px system-ui;font-style:normal;text-align:center;color:#f3e6cb}#bagBtn em:empty{display:none}
#bag{position:absolute;right:170px;bottom:68px;width:230px;height:150px;pointer-events:none;opacity:0;transform:scale(.2) rotate(-14deg);transform-origin:20% 110%;transition:transform .28s cubic-bezier(.3,1.4,.5,1),opacity .2s;filter:drop-shadow(0 8px 14px #000a)}
#bag.open{opacity:1;transform:none;pointer-events:auto}#bag.shake{animation:shake .4s}
#bag::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 40% 35%,#0000 30%,#6a4a2a66 100%),url(assets/tex/hide_inner.webp) center/300px;clip-path:polygon(6% 14%,20% 4%,34% 9%,50% 3%,66% 9%,81% 4%,95% 13%,91% 34%,99% 50%,92% 68%,96% 88%,80% 97%,64% 91%,50% 98%,35% 91%,19% 97%,4% 87%,8% 67%,1% 50%,9% 33%)}
#bagSpots button{position:absolute;width:52px;height:52px;padding:5px;border:0;background:none;cursor:pointer;filter:drop-shadow(0 3px 3px #0007)}#bagSpots button svg{width:100%;height:100%}
#bagSpots button.none{pointer-events:none}#bagSpots button.none::after{content:"";position:absolute;inset:21px;border-radius:50%;background:#5d452a55}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- stuurduim ---------- */
#joy{left:0;bottom:0;width:0;height:0}
#joy .ring{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #f4f2ec66;background:#0c0f1233;display:none}
#joy .knob{position:fixed;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#f4f2eccc;box-shadow:0 2px 10px #0006;display:none}
#joyHint{left:max(26px,var(--sal));bottom:max(26px,var(--sab));width:110px;height:110px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #f4f2ec44;opacity:.7;padding:32px;color:var(--ink)}

/* ---------- keuzerondje bij een ding ---------- */
#radial{left:0;top:0;width:0;height:0;pointer-events:auto}
#radial button,#swap{position:fixed;margin:-27px 0 0 -27px;animation:say .16s ease-out both}
#radial button.new{color:var(--sun)}
@keyframes say{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- sluiers over het beeld ---------- */
#veil{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at center,transparent 45%,#3a5a10aa 100%)}
#senseVeil{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,transparent 45%,#0a1420cc 100%)}
#senseVeil.on{opacity:.55;transition:opacity 1.8s}
#hurt{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,#c01010cc 100%);transition:opacity .5s}
#weak{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,#a01010b0 100%);transition:opacity .6s}
#fade{position:fixed;inset:0;z-index:6;pointer-events:none;background:#000;opacity:0;transition:opacity 1.2s}

/* ---------- vensters: gemaakt van wat er is. Homo habilis tekent in de grond; Homo erectus spant een huid op en tekent met houtskool en oker. ---------- */
.screen{position:fixed;inset:0;z-index:8;display:none;place-items:center;padding:16px;background:radial-gradient(ellipse at center,#0c0f1280,#0c0f12e0)}
.screen.open{display:grid}
.skin{position:relative;display:flex;max-width:100%;max-height:100%;min-height:0;--py:10px;padding:var(--py) 12px;animation:rise .25s ease-out both;filter:drop-shadow(0 18px 30px #000b);
  --ink:#f3e6cb;--txt:#f3e6cbde;--hi:#fff6e2;--dim:#f3e6cba0;--faint:#f3e6cb66;--line:#f3e6cb30;--glass:#0000002e;--acc:#f0a030;--inv:#22170d;--good:#a9d68f;--ask:#ffc94a;color:var(--ink)}
.skin::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:34px 46px 38px 52px/44px 34px 50px 38px;background:radial-gradient(ellipse at center,#0000 40%,#0009 100%),linear-gradient(#20150cc4,#20150cd6),url(assets/tex/dry_ground_01_diff.webp) center/380px;box-shadow:inset 0 0 0 1px #0007,inset 0 3px 22px #000c}
body.era-erectus .skin{--py:24px;padding:var(--py) 30px;--ink:#2b1b10;--txt:#332115f0;--hi:#1c1009;--dim:#3a2517b8;--faint:#3a251788;--line:#3a251740;--glass:#3a25170f;--acc:#a8481a;--inv:#f3e6cb;--good:#4f6a22;--ask:#a8481a}
body.era-erectus .skin::before{border-radius:0;box-shadow:none;background:radial-gradient(ellipse at center,#0000 55%,#5a3a1c55 100%),url(assets/tex/hide_inner.webp) center/420px;clip-path:polygon(1.2% 1.2%,3.9% 2.1%,6.6% 2.8%,9.3% 3.2%,12.0% 3.6%,14.8% 3.8%,17.5% 3.9%,20.2% 3.8%,22.9% 3.6%,25.6% 3.2%,28.3% 2.8%,31.0% 2.1%,33.7% 1.2%,36.4% 2.6%,39.2% 3.6%,41.9% 4.3%,44.6% 4.9%,47.3% 5.2%,50.0% 5.3%,52.7% 5.2%,55.4% 4.9%,58.1% 4.3%,60.8% 3.6%,63.6% 2.6%,66.3% 1.2%,69.0% 2.5%,71.7% 3.4%,74.4% 4.1%,77.1% 4.6%,79.8% 4.9%,82.5% 5.0%,85.2% 4.9%,88.0% 4.6%,90.7% 4.1%,93.4% 3.4%,96.1% 2.5%,98.8% 1.2%,98.1% 5.3%,97.5% 9.3%,97.1% 13.4%,96.8% 17.5%,96.7% 21.5%,96.6% 25.6%,96.7% 29.7%,96.8% 33.7%,97.1% 37.8%,97.5% 41.9%,98.1% 45.9%,98.8% 50.0%,98.1% 54.1%,97.7% 58.1%,97.3% 62.2%,97.1% 66.3%,96.9% 70.3%,96.8% 74.4%,96.9% 78.5%,97.1% 82.5%,97.3% 86.6%,97.7% 90.7%,98.1% 94.7%,98.8% 98.8%,96.1% 97.9%,93.4% 97.2%,90.7% 96.8%,88.0% 96.4%,85.2% 96.2%,82.5% 96.1%,79.8% 96.2%,77.1% 96.4%,74.4% 96.8%,71.7% 97.2%,69.0% 97.9%,66.3% 98.8%,63.6% 97.4%,60.8% 96.4%,58.1% 95.7%,55.4% 95.1%,52.7% 94.8%,50.0% 94.7%,47.3% 94.8%,44.6% 95.1%,41.9% 95.7%,39.2% 96.4%,36.4% 97.4%,33.7% 98.8%,31.0% 97.5%,28.3% 96.6%,25.6% 95.9%,22.9% 95.4%,20.2% 95.1%,17.5% 95.0%,14.8% 95.1%,12.0% 95.4%,9.3% 95.9%,6.6% 96.6%,3.9% 97.5%,1.2% 98.8%,1.9% 94.7%,2.5% 90.7%,2.9% 86.6%,3.2% 82.5%,3.3% 78.5%,3.4% 74.4%,3.3% 70.3%,3.2% 66.3%,2.9% 62.2%,2.5% 58.1%,1.9% 54.1%,1.2% 50.0%,1.9% 45.9%,2.3% 41.9%,2.7% 37.8%,2.9% 33.7%,3.1% 29.7%,3.2% 25.6%,3.1% 21.5%,2.9% 17.5%,2.7% 13.4%,2.3% 9.3%,1.9% 5.3%)}
body.era-erectus .skin::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 1.6% 2.2%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 33.7% 2.2%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 66.3% 2.2%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 98.4% 2.2%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 98.4% 50.0%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 98.4% 97.8%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 66.3% 97.8%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 33.7% 97.8%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 1.6% 97.8%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px),radial-gradient(circle at 1.6% 50.0%,#1c120a 0 3.5px,#6a4a2c 4px 5.5px,#0000 6px)}
.card{width:min(460px,calc(100vw - 92px));max-height:calc(100vh - 34px - 2*var(--py));max-height:calc(100dvh - 34px - 2*var(--py));overflow:auto;padding:14px 18px;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card{-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),#0000);mask-image:linear-gradient(#000 calc(100% - 16px),#0000);padding-bottom:20px}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card h2{margin:8px 0 8px;font:400 30px/1.1 Kool,system-ui,sans-serif;letter-spacing:.01em;color:var(--hi)}
.card h3{margin:16px 0 4px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.card p{margin:7px 0;color:var(--txt);font-size:15px;line-height:1.5}
.card b{font-weight:700;color:var(--hi)}
.card .know{color:var(--good)}
.tabs{display:flex;gap:6px;margin:8px 0 4px}.tabs .key{flex:1;height:38px;font-size:11px;letter-spacing:.1em}
.card h3.sure{display:flex;align-items:center;gap:8px;color:var(--ink)}.card h3.sure i{width:10px;height:10px;border-radius:50%;background:var(--leaf)}.card h3.sure.aannemelijk i{background:var(--sun)}.card h3.sure.onzeker i{background:#e08a3c}.card h3.sure.artistiek i{background:#b48ad8}.card h3.sure+.fine{margin:0 0 2px}
.card .q{color:var(--ask);font-style:italic}
.card .big{width:64px;height:64px;float:right;margin:0 0 6px 12px;filter:drop-shadow(0 3px 6px #0008)}
.card .fine{font-size:11px;color:var(--faint);line-height:1.45}
.card .fine a{color:var(--dim)}
.card .desk{font-size:13px;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.menu{display:grid;gap:8px;margin-top:14px}.menu .key{height:46px;font-size:13px}
.set{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px;margin-top:12px}
.set label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.slide{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim)}
.slide input{flex:1;min-width:0;height:30px;margin:0;accent-color:var(--acc);touch-action:none}
.areas{display:grid;gap:10px;margin-top:10px}.era{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.era span{grid-column:1/-1;font-size:11px;font-style:italic;color:var(--dim)}.key.area{height:50px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-transform:none;letter-spacing:.02em;white-space:normal}.key.area b{font-size:13px}.key.area i{font-style:normal;font-weight:400;font-size:11px;opacity:.75}.key.area.on b,.key.area:active b{color:var(--inv)}
.pick{display:flex;gap:6px}.pick .key{flex:1;padding:0 4px;height:38px;font-size:11px;letter-spacing:.1em}
#menuCard .row .key{flex:1;height:44px}#menuCard .fine{margin:6px 0 0 114px}
#menuScreen{z-index:9}
.row .btn{padding:12px 34px}
ul{list-style:none;padding:0;margin:8px 0}
li{position:relative;margin:0;padding:6px 0 6px 16px;font-size:14px;line-height:1.4;color:var(--txt,#f4f2ecd9);border-top:1px solid var(--line)}
li:first-child{border-top:0}
li::before{content:"";position:absolute;left:1px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--acc,var(--ink))}
li.no{color:var(--faint)}
/* de stap van je missie: één kleine regel bovenaan in het midden, waar geen duim komt. Je kunt er dwars doorheen tikken. */
#quest{top:max(12px,var(--sat));left:50%;transform:translateX(-50%);width:max-content;max-width:min(420px,50vw);text-align:center;font-size:13px;font-weight:600;line-height:1.3;color:#f3e6cb;text-shadow:0 1px 3px #000,0 0 8px #000c;opacity:0;transition:opacity 1.2s}
#quest.on{opacity:.95;transition:opacity .3s}#quest.tick::before{content:'✓ ';color:#f0a030}#toast.on~#quest{opacity:0}
body.newver #menuBtn::after{content:'';position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;background:#f0a030;box-shadow:0 0 0 2px #2c2117,0 0 8px #f0a030}
#questBtn{display:none;width:44px;height:44px;margin-right:8px;opacity:.85}#questBtn.show{display:inline-grid}
#questBtn em{position:absolute;right:-2px;top:-2px;min-width:17px;height:17px;border-radius:9px;background:#2c2117e6;font:700 11px/17px system-ui;font-style:normal;text-align:center;color:#f3e6cb}#questBtn em:empty{display:none}
.mlist{display:grid;gap:8px;margin-top:12px}
.mrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;font:inherit;color:var(--ink);padding:6px 12px;border:0;border-radius:10px 13px 11px 14px/13px 10px 14px 11px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;touch-action:manipulation}
.mrow.now{box-shadow:inset 0 0 0 2px var(--acc)}.mrow b{font:400 19px/1.15 Kool,system-ui,sans-serif}.mface{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--glass);box-shadow:0 0 0 1.5px var(--line)}.mwant{display:grid;width:30px;height:30px;color:var(--acc)}.mwant svg{width:100%;height:100%}
.mrow .steps{grid-column:1/-1;margin:6px 0 0}
.notch{display:flex;gap:4px}.notch i{width:5px;height:16px;border-radius:2px;background:var(--line)}.notch i.ok{background:var(--ink)}.notch i.at{background:var(--acc)}
.card.wide{width:min(720px,calc(100vw - 92px))}
.mishead{display:flex;justify-content:space-between;align-items:center;gap:14px}.mishead>div{flex:1}.mishead .btn{padding:8px 16px;font-size:12px}
@media (max-height:500px){.card.wide{padding:10px 16px}.mis{padding:6px 10px}.missions{margin:5px 0 0;gap:6px}}
.missions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mis{padding:8px 11px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line);background:#f4f2ec0d;cursor:pointer;font-size:12px;line-height:1.35}
.mis b{display:block;font-size:13.5px;color:#f0a030}.mis span{color:var(--dim)}.mis i{display:block;font-size:11px;color:#f0a030;margin-top:2px}
.mis ol{margin:4px 0 0;padding-left:17px}.mis ol li{padding:0;font-size:11.5px;line-height:1.3;list-style:decimal}.mis ol li::before{display:none}
.mis.now{box-shadow:inset 0 0 0 1.5px #f0a030}.mis.done{opacity:.55;cursor:default}.mis.done b{color:var(--ink)}.mis.locked{opacity:.45;cursor:default}
@media (max-width:520px){.missions{grid-template-columns:1fr}}
li.no::before{background:none;box-shadow:inset 0 0 0 1px var(--faint)}
@media (pointer:coarse){.desk{display:none}}
@media (max-height:500px){.menu{gap:6px;margin-top:8px}.menu .key{height:40px}.set{margin-top:7px}#menuCard .row{margin-top:10px}.screen{padding:8px}.card{padding:8px 14px;width:min(680px,calc(100vw - 92px))}.card h2{font-size:25px;margin:4px 0 3px}.card p{font-size:12.5px;line-height:1.4;margin:3px 0}li{font-size:12.5px;line-height:1.35;padding:3px 0 3px 16px}li::before{top:8px}ul{margin:3px 0}.row{margin-top:8px}.row .btn{padding:9px 30px}.card .fine{font-size:10px}}
@media (max-aspect-ratio:1/1){#toast{top:calc(max(10px,var(--sat)) + 96px);max-width:86vw}}

#rotate{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#0c0f12;text-align:center;padding:30px;font-weight:300;font-size:17px;letter-spacing:.12em;text-transform:uppercase;line-height:1.7}
#rotate svg{width:80px;height:80px;display:block;margin:0 auto 18px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
</style>
</head>
<body>
<div id="veil"></div>
<div id="senseVeil"></div>
<div id="fade"></div>
<div id="hurt"></div>
<div id="weak"></div>
<div id="rotate"><div><svg viewBox="0 0 48 48" fill="none" stroke="#f4f2ec" stroke-width="2.5" stroke-linejoin="round"><rect x="14" y="4" width="20" height="40" rx="4"/><path d="M21 38h6"/></svg>Draai je telefoon een kwartslag.<br>Dit spel speel je liggend.</div></div>
<div class="hud" id="stats">
  <div class="stat" id="statFood"></div><div class="stat" id="statWater"></div><div class="stat" id="statHealth"></div><div class="stat" id="statGroup"></div><div class="stat" id="statSick"></div>
  <div class="stat word" id="dayRow"><span id="dayIcon"></span><span id="dayLbl">1</span></div>
  <div class="stat word" id="homeRow"><span id="homeIcon"></span><svg id="homeDir" viewBox="0 0 24 24" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l7 18-7-5-7 5z"/></svg><span id="homeDist"></span></div>
</div>
<div class="hud" id="topRight"><button class="rb" id="questBtn" aria-label="Missies"><em id="questN"></em></button><button class="rb" id="menuBtn" aria-label="Menu"></button></div>
<div class="hud" id="toast"></div>
<div class="hud" id="quest"><span id="questT"></span></div>
<div class="hud" id="title"><i id="titleE"></i><b id="titleH"></b><span id="titleS"></span></div>
<div class="hud" id="hint"></div>
<div class="hud" id="homeEdge"><svg id="homeEdgeDir" viewBox="0 0 24 24" width="30" height="30" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l7 18-7-5-7 5z"/></svg><span id="homeEdgeDist"></span></div>
<div class="hud" id="joyHint"></div>
<div class="hud" id="joy"><div class="ring"></div><div class="knob"></div></div>
<div class="hud" id="pad">
  <div id="bag"><div id="bagSpots"></div></div>
  <div id="hands">
    <button class="rb" id="bagBtn" aria-label="Tas" style="display:none"></button>
    <button class="hand" id="hand0" aria-label="Linkerhand"></button>
    <button class="hand right" id="hand1" aria-label="Rechterhand"></button>
  </div>
  <div id="act">
    <button class="rb alt" id="alt0"></button><button class="rb alt" id="alt1"></button><button class="rb alt" id="alt2"></button>
    <button class="rb" id="doBtn"></button>
  </div>
</div>
<div class="hud" id="radial"></div>
<button class="rb" id="swap" aria-label="Ruil" style="display:none;z-index:4;pointer-events:auto"></button>

<div class="hud" id="loading">Laden…</div>
<template id="credits">Hoofdpersoon door gb.prof.69 met bewegingen van Quaternius (CC0); hyena en olifant door <a href="https://animalanimator.com">Animal Animator</a>, luipaard door GremorySaiyan, gazelle door kenchoo, sabeltandkat door slang107123456789, zebra door NoaSeller (Sketchfab, CC BY 4.0). Natuur: Poly Haven (CC0). <a href="assets/CREDITS.md">Alle bronnen</a></template>

<div class="screen" id="cardScreen"><div class="skin"><div class="card" id="card"></div></div></div>
<div class="screen" id="menuScreen"><div class="skin"><div class="card" id="menuCard"></div></div></div>

<script>
// Versie van deze uitrol (de uitrol vult ze in). Staat er online een nieuwere, dan laden we die: zo speel je nooit een oud spel.
window.__V = '__VERSION__'; window.__VA = '__ASSETS__';
(function () {
  if (__V[0] === '_') return;
  const check = () => fetch('./version.json?' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then((j) => {
    const atStart = !window.__played;
    if (j.v && j.v !== __V && atStart && !location.search.includes(j.v)) location.replace('./?v=' + j.v);
    // al aan het spelen: niet zomaar herladen. Een stipje op de menuknop zegt dat er een nieuwere versie klaarstaat; in het menu laad je hem.
    else if (j.v && j.v !== __V) { window.__newV = j.v; document.body.classList.add('newver'); }
  }).catch(() => {});
  check(); document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); }); setInterval(check, 120000);
})();
</script>
<script type="module" src="./src/main.js"></script>
</body>
