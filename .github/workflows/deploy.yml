name: Deploy Homo Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Stamp version
        # elke uitrol krijgt een eigen map voor de code, zodat telefoons nooit oude en nieuwe bestanden mengen
        run: |
          V=${GITHUB_SHA::8}
          A=$(git rev-parse HEAD:v4/assets | cut -c1-8)
          mv v4/src v4/src-$V
          sed -i "s|./src/main.js|./src-$V/main.js|; s|__VERSION__|$V|; s|__ASSETS__|$A|" v4/index.html
          echo "{\"v\":\"$V\"}" > v4/version.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
