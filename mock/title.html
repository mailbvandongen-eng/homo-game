<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated}
.ui{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;pointer-events:none}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14vh;gap:10px}
.sub{color:#fffbe6;font-weight:800;font-size:clamp(13px,2.2vw,19px);text-shadow:0 2px 0 #2a4a1e,0 0 8px #2a4a1e;letter-spacing:.04em;position:absolute;top:39vh;left:0;right:0;text-align:center}
.row{display:flex;gap:12px;pointer-events:auto}
.btn{font:900 clamp(17px,2.9vw,23px) system-ui,sans-serif;padding:14px 30px 15px;border:none;background:transparent center/100% 100% no-repeat;image-rendering:pixelated;cursor:pointer;color:#fff3c0;text-shadow:2px 0 #3a1e0c,-2px 0 #3a1e0c,0 2px #3a1e0c,0 -2px #3a1e0c,2px 2px #3a1e0c,-2px 2px #3a1e0c,2px -2px #3a1e0c,-2px -2px #3a1e0c;filter:drop-shadow(0 4px 0 #0006)}
.play{color:#ffe46a}
.map{color:#c8f08a}
.icons{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:12px;display:flex;gap:8px;pointer-events:auto}
.ic{width:46px;height:46px;background:center/100% 100% no-repeat;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0006);cursor:pointer}
.ver{position:fixed;left:14px;bottom:14px;color:#fffbe6;font:700 12px system-ui;text-shadow:0 1px 0 #2a1a0c}
</style></head><body>
<canvas id="c"></canvas>
<div class="sub">Van de eerste mens tot Mars</div>
<div class="ui"><div class="mid"><div class="row"><button class="btn play">▶ Spelen</button><button class="btn map">Kies level</button></div></div></div>
<div class="icons"><div class="ic" data-i="music"></div><div class="ic" data-i="sound"></div><div class="ic" data-i="film"></div><div class="ic" data-i="update"></div></div>
<div class="ver">versie 0.29.0</div>
<script type="module">
// Altijd de nieuwste versie: eerst de spelbestanden vers ophalen (anders bewaart de browser ze tot 10 minuten)
await Promise.all(['title.js', 'rig.js', 'species.js'].map(f => fetch('../v2/src/' + f, { cache: 'reload' }).catch(() => {})));
const { TitleScene, TH, plankBoard, logSlice } = await import('../v2/src/title.js');
document.querySelectorAll('.btn').forEach((b, i) => { b.style.backgroundImage = `url(${plankBoard(64, 1, 18, 5 + i * 4).toDataURL()})`; });
const ICONS = {
  music: ['0001111', '0001001', '0001001', '0001001', '0111011', '1111111', '0110110'],
  sound: ['0001000', '0011010', '1111001', '1111101', '1111001', '0011010', '0001000'],
  film: ['1111111', '1010101', '1111111', '1000001', '1011001', '1000001', '1111111'],
  update: ['0111100', '1000010', '1000111', '1000010', '1000000', '1000001', '0111110'],
};
document.querySelectorAll('.ic').forEach(el => { el.style.backgroundImage = `url(${logSlice(ICONS[el.dataset.i]).toDataURL()})`; });
const cv = document.getElementById('c'), c = cv.getContext('2d'), sc = new TitleScene();
const loop = now => { const W = Math.round(TH * innerWidth / innerHeight); if (cv.width !== W) { cv.width = W; cv.height = TH; } sc.draw(c, W, (window.T ?? now / 1000)); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
</script></body></html>
